# Denní běh na GitLabu.
# Spouští se jen z plánu (Build > Pipeline schedules) nebo ručně (Run pipeline).
# Proměnná v Settings > CI/CD > Variables: PROJEKT_TOKEN
#   (Project access token, role Maintainer, práva api + write_repository; Masked)
#   Bez něj se web nasadí, ale data se neuloží zpět do repa (ztratí se paměť změn).
# Plány (input "job"; výchozí je sber):
#   1) denně v 05:13, input job = sber (nebo nechat výchozí)
#   2) denně v 12:37, input job = hlidac
spec:
  inputs:
    job:
      default: sber
      options: [sber, hlidac]
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'

default:
  image: python:3.12-slim

stages: [sber, nasazeni]

sber:
  stage: sber
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && "$[[ inputs.job ]]" == "sber"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl >/dev/null
    - pip install -q -r requirements.txt
  script:
    - python run.py
    - |
      if [ -n "$PROJEKT_TOKEN" ]; then
        git config user.name "kulturni-vlozky-bot"
        git config user.email "bot@users.noreply.gitlab.com"
        git add data
        git commit -m "Data $(TZ=Europe/Prague date +%F) [skip ci]" || echo "beze změn"
        git push "https://bot:${PROJEKT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
        # problémy se zdroji -> issue (přijde e-mail)
        if [ -s data/problemy.md ]; then
          curl -s --request POST --header "PRIVATE-TOKEN: ${PROJEKT_TOKEN}" \
            --data-urlencode "title=Problém se zdroji $(TZ=Europe/Prague date +%F)" \
            --data-urlencode "description=$(cat data/problemy.md)" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues" >/dev/null
        fi
      else
        echo "PROJEKT_TOKEN není nastaven – data se neukládají do repa"
      fi
  artifacts:
    paths: [data]
    expire_in: 2 days

hlidac:
  stage: sber
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && "$[[ inputs.job ]]" == "hlidac"'
  script:
    # selže (a GitLab pošle e-mail), pokud jsou data starší než 30 h
    - |
      python3 - <<'PY'
      import json, datetime as dt, sys
      m = json.load(open("data/akce.json"))["meta"]
      t = dt.datetime.fromisoformat(m["vygenerovano"])
      h = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600
      print(f"Data jsou stará {h:.0f} h")
      sys.exit(1 if h > 30 else 0)
      PY

pages:
  stage: nasazeni
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && "$[[ inputs.job ]]" == "sber"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  needs:
    - job: sber
      artifacts: true
  script:
    - mkdir -p public/data
    - cp index.html public/
    - cp data/*.json public/data/
  artifacts:
    paths: [public]
