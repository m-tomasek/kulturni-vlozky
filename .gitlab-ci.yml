# Denní běh na GitLabu.
# Spouští se jen z plánu (Build > Pipeline schedules) nebo ručně (Run pipeline), a jen na hlavní větvi.
# Proměnná v Settings > CI/CD > Variables: PROJEKT_TOKEN
#   (Project access token, role Maintainer, práva api + write_repository; Masked + Protected)
#   Bez něj se web nasadí, ale data se neuloží zpět do repa (ztratí se paměť změn).
# Plány (input "job"; výchozí je sber):
#   1) denně v 05:13, input job = sber (nebo nechat výchozí)
#   2) denně v 12:37, input job = hlidac – zkontroluje čerstvost dat a znovu načte weby,
#      které ráno selhaly (dosběr); když se povedou, web se hned aktualizuje
# Ruční běh s input job = snapshot stáhne stránky z nastroje/pruzkum.txt (artefakt raw/).
spec:
  inputs:
    job:
      default: sber
      options: [sber, hlidac, snapshot]
    zdroje:
      # jen u ručního sběru: id zdrojů oddělená čárkou (např. "camp,myko") – načtou se jen ty,
      # ostatní akce zůstanou, jak byly. Prázdné = všechny zdroje (běžný denní sběr).
      default: ""
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/ && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'

default:
  image: python:3.12-slim

stages: [sber, nasazeni]

sber:
  stage: sber
  timeout: 50 minutes
  rules:
    - if: '"$[[ inputs.job ]]" == "sber"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q --root-user-action=ignore -r requirements.txt
  script:
    # testy logiky (bez sítě): když neprojdou, sběr se nespustí a nic se nepřepíše
    - python -m unittest discover -s tests
    - python run.py --jen "$[[ inputs.zdroje ]]"
    - &uloz |
      if [ -n "$PROJEKT_TOKEN" ]; then
        REMOTE="https://bot:${PROJEKT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git config user.name "kulturni-vlozky-bot"
        git config user.email "bot@users.noreply.gitlab.com"
        git add data
        git commit -q -m "Data $(TZ=Europe/Prague date +%F) [skip ci]" || echo "beze změn"
        # mezitím mohl do repa přibýt jiný commit (úprava kódu) – zařadit se za něj
        git fetch -q "$REMOTE" "${CI_DEFAULT_BRANCH}"
        git rebase -q FETCH_HEAD
        git push -q "$REMOTE" "HEAD:${CI_DEFAULT_BRANCH}"
        # problémy se zdroji -> jedno issue (přijde e-mail); když vše funguje, issue se zavře
        python nastroje/issue.py
      else
        echo "PROJEKT_TOKEN není nastaven – data se neukládají do repa"
      fi
  artifacts:
    paths: [data]
    expire_in: 2 days

# dosběr: weby, které při ranním sběru selhaly (výpadek, chyba 5xx), se zkusí znovu
dosber:
  stage: sber
  timeout: 20 minutes
  rules:
    - if: '"$[[ inputs.job ]]" == "hlidac"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q --root-user-action=ignore -r requirements.txt
  script:
    - python -m unittest discover -s tests
    - python run.py --jen-chybne
    - *uloz
  artifacts:
    paths: [data]
    expire_in: 2 days

hlidac:
  stage: sber
  rules:
    - if: '"$[[ inputs.job ]]" == "hlidac"'
  script:
    # selže (a GitLab pošle e-mail), pokud jsou data starší než 30 h
    - |
      python3 - <<'PY'
      import json, datetime as dt, sys
      m = json.load(open("data/akce.json"))["meta"]
      t = dt.datetime.fromisoformat(m["vygenerovano"])
      h = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600
      print(f"Data jsou stará {h:.0f} h")
      sys.exit(1 if h > 30 else 0)
      PY

snapshot:
  stage: sber
  rules:
    - if: '"$[[ inputs.job ]]" == "snapshot"'
  script:
    - pip install -q --root-user-action=ignore -r requirements.txt
    - python nastroje/snapshot.py --pruzkum
    - python nastroje/prohlidni.py
    - python nastroje/zkus.py || true
  artifacts:
    paths: [raw]
    expire_in: 7 days

pages:
  stage: nasazeni
  rules:
    - if: '"$[[ inputs.job ]]" =~ /^(sber|hlidac)$/'
  needs:
    - job: sber
      artifacts: true
      optional: true
    - job: dosber
      artifacts: true
      optional: true
  script:
    - mkdir -p public/data
    - cp index.html public/
    - cp data/zdravi.json public/data/
    # akce rozdělené po týdnech: web stáhne nejdřív nejbližší dny, zbytek na pozadí
    - python nastroje/rozdel.py public/data
    # mapová knihovna z npm s ověřeným otiskem (web ji nebere z cizího CDN)
    - python nastroje/leaflet.py public/vendor/leaflet
    # předkomprimované soubory: GitLab Pages je pošle zabalené (data jsou pak ~6× menší, web se načte rychleji)
    - find public -type f \( -name '*.json' -o -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec gzip -k -9 {} \;
  artifacts:
    paths: [public]
