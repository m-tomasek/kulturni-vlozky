<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulturní vložky</title>
<meta name="description" content="Kulturní program v Praze na jednom místě: divadla, kluby, kina, galerie a celý GoOut.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --ink:#11151B; --muted:#646E7A; --faint:#9AA3AE;
  --rule:#E1E5EB; --rule-strong:#C9D0D8;
  --accent:#2E45F0; --accent-soft:#E6E9FF; --weekend:#EEF0F4;
  --sold:#C8244F; --free:#0E8656; --warn:#9A6500;
  --c-divadlo:#E0457B; --c-improvizace:#D99A00; --c-koncert:#2F7FE6; --c-tanec:#8257E5;
  --c-prednaska:#12A27A; --c-vystava:#EE7A2B; --c-festival:#0BA9B8; --c-film:#6F7C90;
  --c-spolecenska:#7FA816; --c-jine:#A2ABB8;
  --sans:"Archivo","Helvetica Neue",Helvetica,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --s-1:clamp(.78rem,.15vw + .74rem,.85rem);
  --s0:clamp(.95rem,.2vw + .9rem,1.04rem);
  --s1:clamp(1.08rem,.4vw + 1rem,1.28rem);
  --s2:clamp(1.35rem,.9vw + 1.15rem,1.8rem);
}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --panel:#161A21; --ink:#E8ECF2; --muted:#8C96A3; --faint:#5D6673;
    --rule:#232933; --rule-strong:#343C48; --accent:#8496FF; --accent-soft:#1D2347; --weekend:#13171D;
    --sold:#FF7A98; --free:#5DD39E; --warn:#F2C14E;
    --c-divadlo:#FF6E9E; --c-improvizace:#FFC933; --c-koncert:#5EA2FF; --c-tanec:#A98BFF;
    --c-prednaska:#3DD3A3; --c-vystava:#FF9A55; --c-festival:#36D3E0; --c-film:#9AA6B8;
    --c-spolecenska:#AEDB3A; --c-jine:#6E7887;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:190px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--s0)/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.page{max-width:880px;margin:0 auto;padding:28px 16px 80px}

/* hlavička */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px}
.top h1{margin:0;font-weight:850;font-stretch:62%;font-size:clamp(2rem,3.4vw + 1rem,3rem);line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
.top h1 span{font-weight:300}
.top .pod{margin-top:6px;font-family:var(--sans);font-stretch:92%}
.top p{margin:0;font-family:var(--mono);font-size:var(--s-1);color:var(--muted)}

/* lepící lišta: dny + filtry */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 0;margin:0 -16px;padding-left:16px;padding-right:16px;
  border-bottom:1px solid var(--rule)}
.days{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;scrollbar-width:thin}
@media (min-width:720px){.days{flex-wrap:wrap;overflow-x:visible}}
.days::-webkit-scrollbar{height:4px}.days::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:4px}
.chip{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  min-width:58px;height:66px;padding:7px 9px;border-radius:10px;background:var(--panel);border:1px solid var(--rule);text-align:left;
  transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--rule-strong)}
.chip .w{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip .d{font-weight:800;font-stretch:75%;font-size:1.35rem;line-height:1}
.chip .c{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.chip .c i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chip.we{background:var(--weekend)}
.chip.empty{border-style:dashed}.chip.empty .d{color:var(--muted)}
.chip.special{min-width:auto;justify-content:center;gap:4px;padding:7px 12px}
.chip.special .d{font-size:1.02rem;font-stretch:88%;text-transform:uppercase;letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip[aria-pressed="true"] .w,.chip[aria-pressed="true"] .c{color:var(--ink)}
.sep{flex:0 0 1px;background:var(--rule);margin:6px 4px 18px}
.datepick{position:relative}
.datepick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.datepick:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.datepick.sel{background:var(--accent-soft);border-color:var(--accent)}
.datepick select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:16px}
.datepick:has(select:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.chip.special.obd{justify-content:space-between;align-items:flex-start;gap:2px}
.chip.special.obd .d{font-size:.95rem;white-space:nowrap}
details.dlouhe{margin-top:8px}
details.dlouhe>summary{cursor:pointer;list-style:none}
details.dlouhe>summary::-webkit-details-marker{display:none}
details.dlouhe>summary .dayhead::after{content:"▸";font-family:var(--mono);color:var(--muted);margin-left:auto}
details.dlouhe[open]>summary .dayhead::after{content:"▾"}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:0 0 12px}
.type{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);
  background:var(--panel);font-size:var(--s-1);font-stretch:92%}
.type i{width:7px;height:7px;border-radius:50%}
.type[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.filters .grow{flex:1 1 160px;min-width:140px}
.filters input[type=search],.filters select{font-size:var(--s-1);padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
.filters input[type=search]{width:100%}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:var(--s-1);color:var(--muted);cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--accent)}
.more{display:none;font-size:var(--s-1);color:var(--muted);padding:4px 0}
@media (max-width:640px){
  .filters{display:none}
  .filters.open{display:flex}
  .more{display:inline-flex;gap:6px;align-items:center;margin:0 0 10px}
}

/* hlášky */
.alert{margin:14px 0 0;padding:8px 12px;border-left:3px solid var(--sold);background:var(--panel);font-size:var(--s-1);color:var(--muted)}
.alert b{color:var(--ink);font-weight:600}
.alert[hidden]{display:none}

/* seznam */
.dayhead{display:flex;align-items:baseline;gap:10px;margin:32px 0 6px}
.dayhead h2{margin:0;font-weight:800;font-stretch:75%;font-size:var(--s2);text-transform:uppercase;line-height:1}
.dayhead .dt{font-family:var(--mono);font-size:var(--s0);font-weight:500;font-stretch:100%;text-transform:none;margin-left:6px}
.dayhead .n{font-size:var(--s-1);color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ev{display:grid;grid-template-columns:60px 1fr auto;gap:2px 16px;padding:13px 16px;border-top:1px solid var(--rule)}
.ev:first-child{border-top:0}
.ev .time{font-family:var(--mono);font-size:var(--s-1);font-weight:500;padding-top:3px}
.ev .time small{display:block;color:var(--muted);font-weight:400}
.ev h3{margin:0;font-weight:650;font-stretch:90%;font-size:var(--s1);line-height:1.25}
.ev h3 a{text-decoration:none}.ev h3 a:hover{text-decoration:underline}
.ev .info{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:3px;font-size:var(--s-1);color:var(--muted)}
.ev .info .t{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.ev .info .t i{width:7px;height:7px;border-radius:50%}
.st-new{color:var(--accent);font-weight:600}
.gooutlbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:0 6px;border:1px solid var(--rule-strong);border-radius:4px;color:var(--muted)}
.st-sold{color:var(--sold)}.st-free{color:var(--free)}.st-warn{color:var(--warn)}
.ev .acts{display:flex;align-items:flex-start;gap:12px;font-size:var(--s-1);white-space:nowrap;padding-top:3px}
.ev .acts a,.ev .acts button{color:var(--muted);text-decoration:none}
.ev .acts a:hover,.ev .acts button:hover{color:var(--ink);text-decoration:underline}
.ev .acts .add{color:var(--accent);font-weight:600}
.ev.cancel h3,.ev.cancel .time{text-decoration:line-through;color:var(--muted)}
@media (max-width:640px){
  .ev{grid-template-columns:48px 1fr;padding:12px 12px}
  .ev .acts{grid-column:2;margin-top:6px}
}
.nic{padding:48px 0;color:var(--muted);text-align:center}

footer{margin-top:56px;font-size:var(--s-1);color:var(--muted)}
footer h2{font-size:var(--s-1);font-family:var(--mono);font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}
footer ul{list-style:none;margin:0;padding:0;columns:3;column-gap:24px}
footer li{break-inside:avoid;padding:1px 0}
footer .bad{color:var(--sold)}
footer .go{font-size:10.5px;color:var(--faint);margin-left:4px}
@media (max-width:640px){footer ul{columns:2}}
/* přepínač zobrazení */
.pohled{display:inline-flex;padding:2px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel)}
.pohled button{font-family:var(--mono);font-size:var(--s-1);padding:3px 11px;border-radius:999px;color:var(--muted)}
.pohled button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
body.kal .page{max-width:1180px}
body.kal .bar{padding-top:12px}

/* kalendář */
#kal{margin-top:22px}
.khlava{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.khlava h2{margin:0;font-weight:850;font-stretch:70%;font-size:var(--s2);text-transform:uppercase;line-height:1;min-width:8.5em}
.khlava h2 span{font-weight:300}
.knav{display:inline-flex;gap:4px}
.knav button,.kdnes{width:34px;height:34px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--panel);font-size:1.1rem;line-height:1}
.kdnes{width:auto;padding:0 12px;font-size:var(--s-1);font-family:var(--mono)}
.kmes{background:var(--accent-soft);border-color:var(--accent)}
.knav button:disabled{opacity:.35;cursor:default}
.ksouhrn{flex:1 1 220px;font-size:var(--s-1);color:var(--muted);text-align:right}
.kobsah{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.kmrizka{position:sticky;top:96px}
.ktyden{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kdny{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px 4px}
.kdny span:nth-child(n+6){color:var(--ink)}
.kr+.kr{margin-top:6px}
.kd{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;
  aspect-ratio:1/0.92;min-height:62px;padding:7px 8px 8px;border-radius:10px;border:1px solid var(--rule);
  background:color-mix(in srgb,var(--accent) calc(var(--h,0)*1%),var(--panel));transition:border-color .12s,transform .12s}
.kd:hover:not(:disabled){border-color:var(--rule-strong)}
.kd.we{border-color:var(--rule-strong)}
.kd .kn{font-weight:800;font-stretch:78%;font-size:1.25rem;line-height:1}
.kd .kc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.kd .kb{display:flex;width:100%;height:4px;border-radius:2px;overflow:hidden;background:var(--rule)}
.kd .kb i{display:block;height:100%}
.kd .kx{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.kd.dnes .kn{color:var(--accent)}
.kd.dnes{box-shadow:inset 0 0 0 1px var(--accent)}
.kd[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);transform:translateY(-1px)}
.kd:disabled{cursor:default;background:transparent;border-style:dashed}
.kd:disabled .kn{color:var(--faint);font-weight:500}
.kd.prazdna{visibility:hidden}
.klegenda{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--s-1);color:var(--muted)}
.klegenda .st{display:inline-flex;gap:3px}
.klegenda .st i{width:16px;height:10px;border-radius:3px;border:1px solid var(--rule)}
.klegenda .kx{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px}
.kagenda .dayhead{margin-top:0}
.kagenda .dnav{display:inline-flex;gap:4px;margin-left:auto}
.kagenda .dnav button{width:30px;height:30px;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
.kg{display:flex;align-items:baseline;gap:8px;margin:18px 0 6px;font-family:var(--mono);font-size:var(--s-1);font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kg b{font-weight:500;color:var(--ink)}
.kagenda details{margin-top:18px}
.kagenda summary{cursor:pointer;font-size:var(--s-1);color:var(--muted);padding:6px 0}
.kagenda summary b{color:var(--ink);font-weight:600}
.kagenda .ev{grid-template-columns:52px 1fr}
.kagenda .ev .acts{grid-column:2;margin-top:4px}
@media (max-width:900px){
  .kobsah{grid-template-columns:1fr;gap:18px}
  .kmrizka{position:static}
  .ksouhrn{text-align:left;flex-basis:100%;order:3}
}
@media (max-width:520px){
  .ktyden{gap:3px}.kr+.kr{margin-top:3px}
  .kd{min-height:46px;aspect-ratio:auto;padding:5px 5px 6px;border-radius:8px}
  .kd .kn{font-size:1rem}
  .kd .kc{font-size:10px}
  .kd .kx{top:5px;right:5px;width:6px;height:6px}
}

/* mapa */
.topr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mapbtn{font-family:var(--mono);font-size:var(--s-1);padding:4px 10px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel)}
.mapbtn:hover{border-color:var(--ink)}
.mapwrap{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.mapwrap[hidden]{display:none}
.maphead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.maphead b{font-weight:800;font-stretch:75%;text-transform:uppercase;font-size:var(--s1)}
.maphead span{flex:1;font-size:var(--s-1);color:var(--muted)}
.maphead button{font-size:var(--s-1);padding:4px 12px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel)}
#mapel{flex:1;min-height:0}
.leaflet-popup-content{font:400 13px/1.4 var(--sans);margin:10px 12px}
.leaflet-popup-content h4{margin:0 0 4px;font-size:14px}
.leaflet-popup-content ul{margin:0;padding:0;list-style:none;max-height:220px;overflow:auto}
.leaflet-popup-content li{padding:2px 0}
.leaflet-popup-content .mono{color:#646E7A;font-size:11.5px;margin-right:4px}
.pin{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;
  font:600 11px/1 var(--mono);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div><h1>Kulturní <span>vložky</span></h1><p class="pod">kulturní program v Praze na jednom místě</p></div>
    <div class="topr"><p id="meta">načítám…</p>
      <div class="pohled" role="tablist" aria-label="Zobrazení">
        <button role="tab" id="tabSeznam" aria-selected="true" aria-controls="list">Seznam</button>
        <button role="tab" id="tabKal" aria-selected="false" aria-controls="kal">Kalendář</button>
      </div>
      <button class="mapbtn" id="mapBtn" aria-controls="mapa">Mapa</button></div>
  </header>

  <div class="bar">
    <nav class="days" id="days" aria-label="Výběr dne"></nav>
    <button class="more" id="more" aria-expanded="false">Filtry <span id="nf"></span></button>
    <div class="filters" id="filters">
      <div id="types" style="display:contents"></div>
      <select id="place" aria-label="Místo"><option value="">Všechna místa</option></select>
      <select id="when" aria-label="Čas začátku"><option value="">Kdykoli</option><option value="vecer">Po práci (od 17:00)</option><option value="pozde">Pozdě večer (od 21:00)</option><option value="den">Přes den (do 17:00)</option></select>
      <div class="grow"><input type="search" id="q" placeholder="Hledat…" aria-label="Hledat"></div>
      <label class="toggle"><input type="checkbox" id="hideSold"> bez vyprodaných</label>
      <label class="toggle"><input type="checkbox" id="bezGoout"> bez GoOut</label>
    </div>
  </div>

  <div class="alert" id="alert" hidden></div>
  <p id="stav" class="sr" role="status" aria-live="polite"></p>
  <main id="list" role="tabpanel" aria-labelledby="tabSeznam"></main>
  <section id="kal" role="tabpanel" aria-labelledby="tabKal" hidden></section>

  <footer>
    <h2>Sledované zdroje</h2>
    <ul id="sources"></ul>
  </footer>
</div>

<div class="mapwrap" id="mapa" hidden role="dialog" aria-modal="true" aria-label="Mapa míst">
  <div class="maphead"><b>Mapa</b><span id="mapinfo"></span><button id="mapClose">Zavřít</button></div>
  <div id="mapel"></div>
</div>

<script>
const TYPY={divadlo:"Divadlo",improvizace:"Impro",koncert:"Koncert",tanec:"Tanec a performance",prednaska:"Přednáška a debata",
  vystava:"Výstava",festival:"Festival",film:"Film",spolecenska:"Společenské",jine:"Jiné"};
const DNY=["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
const DNY2=["ne","po","út","st","čt","pá","so"];
const MES2=["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
const PASMO=21; // kolik dní ukazovat v pásu
const STROP=400; // kolik akcí vykreslit najednou (zbytek po kliknutí)

const S={sel:"vse", typy:new Set(), misto:"", q:"", hideSold:false, kdy:"", bezGoout:false, vseRadky:false,
  pohled:"seznam", mesic:"", kalDen:""};
const MESICE=["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const MESL=["lednu","únoru","březnu","dubnu","květnu","červnu","červenci","srpnu","září","říjnu","listopadu","prosinci"];
const MESG=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const GOOUT="goout";
let AKCE=[], META={};

const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const odkaz=u=>/^https?:\/\//i.test(u||"")?esc(u):"#"; // cizí data: do href jen http(s)
// dnešní datum v Praze; formátovač je drahý, proto se drží a hodnota obnovuje jednou za minutu
const _fmtDnes=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Prague"}); let _dnes="", _dnesKdy=0;
const dnes=()=>{ const n=Date.now(); if(n-_dnesKdy>60000){ _dnes=_fmtDnes.format(new Date(n)); _dnesKdy=n; } return _dnes; };
const plus=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dow=d=>new Date(d+"T12:00:00").getDay();
const kratce=d=>`${+d.slice(8)}. ${+d.slice(5,7)}.`;
const konec=a=>a.konec_datum||a.datum;
const probiha=(a,d)=>a.datum<=d && konec(a)>=d;
let _novaOd=["",""], _predOd=["","",""];
// Předprodej: akce aspoň 3 týdny dopředu, které se objevily v posledních 14 dnech (právě oznámené,
// lístky se dají koupit s předstihem), nebo u nich web výslovně píše o předprodeji / začátku prodeje.
const PREDPRODEJ_TEXT=/předprodej|prodej (spustíme|startuje|začíná|od)|v prodeji od/i;
const predprodej=a=>{ const t=dnes(); if(_predOd[0]!==t) _predOd=[t,plus(t,21),plus(t,-14)];
  if(a.stav==="vyprodano"||a.stav==="zruseno") return false;
  if(a.znacky&&PREDPRODEJ_TEXT.test(a.znacky)&&a.datum>=t) return true;
  return a.datum>=_predOd[1] && a.poprve_videno!==META.zalozeno && a.poprve_videno>=_predOd[2]; };
const nova=a=>{ const t=dnes(); if(_novaOd[0]!==t) _novaOd=[t,plus(t,-7)]; return a.poprve_videno!==META.zalozeno && a.poprve_videno>=_novaOd[1]; };
/* Týden a měsíc: S.sel = "t:RRRR-MM-DD" (pondělí) nebo "m:RRRR-MM". Proběhlé dny se nepočítají. */
const pondeli=d=>plus(d,-((dow(d)+6)%7));
const poslMes=m=>{const x=new Date(+m.slice(0,4),+m.slice(5,7),0);return `${m}-${String(x.getDate()).padStart(2,"0")}`;};
const mesPlus=(m,n)=>{const x=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`;};
function obdobi(sel){
  const t=dnes(); let od,dd;
  if(/^t:/.test(sel)){ od=sel.slice(2); dd=plus(od,6); }
  else if(/^m:/.test(sel)){ od=sel.slice(2)+"-01"; dd=poslMes(sel.slice(2)); }
  else return null;
  return [od<t?t:od, dd];
}
const tydenText=od=>{const ne=plus(od,6);return od.slice(5,7)===ne.slice(5,7)?`${+od.slice(8)}.–${kratce(ne)}`:`${kratce(od)} – ${kratce(ne)}`;};
function popisVyberu(sel=S.sel){
  const t=dnes(), tyd=pondeli(t), mes=t.slice(0,7);
  if(sel==="vse") return "všechny dny"; if(sel==="nove") return "nově přidané"; if(sel==="predprodej") return "předprodej"; if(sel==="vikend") return "víkend";
  if(sel===`t:${tyd}`) return "tento týden"; if(sel===`t:${plus(tyd,7)}`) return "příští týden";
  if(sel===`m:${mes}`) return "tento měsíc"; if(sel===`m:${mesPlus(mes,1)}`) return `příští měsíc (${MESICE[+mesPlus(mes,1).slice(5)-1]})`;
  if(/^t:/.test(sel)) return `týden ${tydenText(sel.slice(2))}`;
  if(/^m:/.test(sel)) return `${MESICE[+sel.slice(7)-1]} ${sel.slice(2,6)}`;
  return `${DNY[dow(sel)]} ${kratce(sel)}`;
}
function vikend(){ const t=dnes(),w=dow(t); const pa=w===0?plus(t,-2):w===6?plus(t,-1):plus(t,5-w); return [pa,plus(pa,1),plus(pa,2)]; }

function zaklad(a){
  if(S.kdy){ const c=a.cas||""; if(!c) return false;
    if(S.kdy==="vecer"&&c<"17:00") return false; if(S.kdy==="pozde"&&c<"21:00") return false; if(S.kdy==="den"&&c>="17:00") return false; }
  if(S.typy.size && !S.typy.has(a.typ)) return false;
  if(S.misto && a.zdroj!==S.misto) return false;
  if(S.hideSold && a.stav==="vyprodano") return false;
  if(S.bezGoout && a.zdroj===GOOUT) return false;
  if(S.q){ if(a._h===undefined) a._h=`${a.nazev} ${a.misto} ${a.znacky||""}`.toLocaleLowerCase("cs");
    if(!a._h.includes(S.ql)) return false; }
  return true;
}
// výběr (den, víkend, týden, měsíc…) se přeloží na funkci jednou, ne pro každou akci znovu
const _predikaty=new Map();
function predikat(sel){
  const klic=sel+"|"+dnes(); let f=_predikaty.get(klic); if(f) return f;
  if(sel==="vse") f=()=>true;
  else if(sel==="nove") f=nova;
  else if(sel==="vikend"){ const [pa,so,ne]=vikend(); f=a=>(probiha(a,pa)&&(a.cas||"00:00")>="17:00")||probiha(a,so)||probiha(a,ne); }
  else if(sel==="predprodej") f=predprodej;
  else { const o=obdobi(sel); f=o?(a=>a.datum<=o[1] && konec(a)>=o[0]):(a=>probiha(a,sel)); }
  if(_predikaty.size>50) _predikaty.clear(); _predikaty.set(klic,f); return f;
}
const vyber=(a, sel=S.sel)=>predikat(sel)(a);

function gcal(a){
  const p=new URLSearchParams({action:"TEMPLATE",text:a.nazev,ctz:"Europe/Prague",location:a.misto||""});
  const d=a.datum.replaceAll("-",""),pad=n=>String(n).padStart(2,"0");
  if(!a.cas){ p.set("dates",`${d}/${plus(konec(a),1).replaceAll("-","")}`); }
  else{ let [h,m]=a.cas.split(":").map(Number),kd=konec(a),kh,km;
    if(a.konec_cas){[kh,km]=a.konec_cas.split(":").map(Number);if(!a.konec_datum&&a.konec_cas<a.cas)kd=plus(kd,1);} else {kh=h+2;km=m;if(kh>=24){kh-=24;kd=plus(kd,1);}}
    p.set("dates",`${d}T${pad(h)}${pad(m)}00/${kd.replaceAll("-","")}T${pad(kh)}${pad(km)}00`); }
  p.set("details",[a.url&&`Info: ${a.url}`,a.vstupenky&&a.vstupenky!==a.url&&`Vstupenky: ${a.vstupenky}`,a.cena&&`Cena: ${a.cena}`].filter(Boolean).join("\n"));
  return "https://calendar.google.com/calendar/render?"+p;
}

/* ---------- pás dnů ---------- */
function kreslitDny(){
  const t=dnes(), z=AKCE.filter(zaklad), posl=AKCE.reduce((m,a)=>a.datum>m?a.datum:m,t);
  const pocet=sel=>z.filter(a=>vyber(a,sel)).length;
  const novych=z.filter(nova).length;
  const tyd=pondeli(t), mes=t.slice(0,7), pmes=mesPlus(mes,1), zitra=plus(t,1), [pa,,ne]=vikend();
  const cip=(k,nazev,kdy,n,tecka)=>`<button class="chip special obd" data-sel="${k}" aria-pressed="${S.pohled!=="kal"&&S.sel===k}" aria-label="${nazev} (${kdy}), ${n} akcí">
      <span class="w">${kdy}</span><span class="d">${nazev}</span><span class="c">${tecka?"<i></i>":""}${n}</span></button>`;
  const denText=d=>`${DNY2[dow(d)]} ${kratce(d)}`;
  let h=cip(t,"Dnes",denText(t),pocet(t),z.some(a=>probiha(a,t)&&nova(a)));
  h+=cip(zitra,"Zítra",denText(zitra),pocet(zitra),z.some(a=>probiha(a,zitra)&&nova(a)));
  const pozitri=plus(t,2);
  h+=cip(pozitri,"Pozítří",denText(pozitri),pocet(pozitri),z.some(a=>probiha(a,pozitri)&&nova(a)));
  h+=cip("vikend","Víkend",pa.slice(5,7)===ne.slice(5,7)?`${+pa.slice(8)}.–${kratce(ne)}`:`${kratce(pa)} – ${kratce(ne)}`,pocet("vikend"));
  // den vybraný v kalendáři (ne dnes/zítra) – ať je v seznamu vidět, co je vybrané
  if(/^\d{4}/.test(S.sel)&&![t,zitra,pozitri].includes(S.sel)) h+=cip(S.sel,"Vybraný den",denText(S.sel),pocet(S.sel));
  h+=`<span class="sep"></span>`;
  const obd=[[`t:${tyd}`,"Tento týden",tydenText(tyd)],[`t:${plus(tyd,7)}`,"Příští týden",tydenText(plus(tyd,7))],
             [`m:${mes}`,"Tento měsíc",MESICE[+mes.slice(5)-1]],[`m:${pmes}`,"Příští měsíc",MESICE[+pmes.slice(5)-1]]];
  obd.forEach(([k,nazev,kdy])=>{ h+=cip(k,nazev,kdy,pocet(k)); });
  // měsíc vybraný v kalendáři (dál než příští měsíc)
  if(/^m:/.test(S.sel)&&!obd.some(o=>o[0]===S.sel)) h+=cip(S.sel,"Vybraný měsíc",`${MESICE[+S.sel.slice(7)-1]} ${S.sel.slice(2,6)}`,pocet(S.sel));
  h+=`<span class="sep"></span>`;
  // konkrétní den se vybírá v kalendáři
  h+=`<button class="chip special obd" data-pohled="kal" aria-pressed="${S.pohled==="kal"}" aria-label="Vybrat den v kalendáři">
      <span class="w">konkrétní den</span><span class="d">Kalendář</span><span class="c">📅</span></button>`;
  h+=`<span class="sep"></span>`;
  h+=cip("nove","Nově přidané","za 7 dní",novych,novych>0);
  h+=cip("predprodej","Předprodej","za 3 týdny a dál",pocet("predprodej"));
  h+=cip("vse","Vše","celý program",z.length);
  const el=document.getElementById("days"); const sx=el.scrollLeft;
  const f=document.activeElement, fs=el.contains(f)?(f.id?`#${f.id}`:f.dataset.sel?`[data-sel="${f.dataset.sel}"]`:null):null;
  el.innerHTML=h; el.scrollLeft=sx;
  if(fs) el.querySelector(fs)?.focus({preventScroll:true}); // překreslení nesmí sebrat fokus klávesnici
}

/* ---------- seznam ---------- */
function radek(a){
  const info=[];
  info.push(`<span class="t"><i style="background:var(--c-${a.typ})"></i>${TYPY[a.typ]||a.typ}</span>`);
  info.push(`<span>${esc(a.misto||"")}</span>`);
  if(a.opakovani) info.push(`<span>${a.opakovani}× za den (${a.cas}–${a.posledni_cas})</span>`);
  if(a.zdroj===GOOUT) info.push(`<span class="gooutlbl">GoOut</span>`);
  if(a.cena) info.push(`<span>${esc(a.cena)}</span>`);
  if(nova(a)) info.push(`<span class="st-new">nové</span>`);
  if(a.stav==="vyprodano") info.push(`<span class="st-sold">vyprodáno</span>`);
  else if(a.stav==="posledni") info.push(`<span class="st-warn">poslední vstupenky</span>`);
  if(a.stav==="zruseno") info.push(`<span class="st-sold">zrušeno</span>`);
  else if((a.chybi_behu||0)>=2) info.push(`<span class="st-warn">možná zrušeno</span>`);
  (a.zmeny||[]).slice(0,1).forEach(z=>info.push(`<span class="st-warn">${esc(z.co)} (${kratce(z.kdy)})</span>`));
  const vice=a.konec_datum&&a.konec_datum!==a.datum;
  const cas=a.cas||(vice?"celý den":"—");
  const pod=vice?`<small>do ${kratce(a.konec_datum)}</small>`:a.opakovani?`<small>až ${a.posledni_cas}</small>`:a.konec_cas?`<small>–${a.konec_cas}</small>`:"";
  return `<article class="ev ${a.stav==="zruseno"?"cancel":""}">
    <div class="time">${esc(cas)}${pod}</div>
    <div><h3><a href="${odkaz(a.url||a.vstupenky)}" target="_blank" rel="noopener">${esc(a.nazev)}</a></h3>
      <div class="info">${info.join("")}</div></div>
    <div class="acts">
      <a class="add" href="${gcal(a)}" target="_blank" rel="noopener" title="Přidat do Google Kalendáře">+ kalendář</a>
      ${a.vstupenky&&a.stav!=="vyprodano"?`<a href="${odkaz(a.vstupenky)}" target="_blank" rel="noopener">vstupenky</a>`:""}
    </div></article>`;
}
function kreslitSeznam(){
  const t=dnes(), jeDen=/^\d{4}/.test(S.sel), o=obdobi(S.sel);
  let v=AKCE.filter(a=>zaklad(a)&&vyber(a));
  // u týdne a měsíce: výstavy a jiné akce, které běží déle a začaly dřív, by zahltily první den – dají se na konec
  let dlouhe=[];
  if(o){ dlouhe=v.filter(a=>a.datum<o[0]&&konec(a)>a.datum); v=v.filter(a=>!dlouhe.includes(a)); }
  const el=document.getElementById("list"), celkem=v.length;
  document.getElementById("stav").textContent=celkem+dlouhe.length?`Zobrazeno ${celkem+dlouhe.length} akcí – ${popisVyberu().replace(/\.$/,"")}.`:"Žádná akce neodpovídá výběru.";
  if(!v.length&&!dlouhe.length){ el.innerHTML=`<p class="nic">${S.sel==="nove"?"Za posledních 7 dní nic nového nepřibylo.":"Nic tu není – zkus jiný den nebo uvolni filtry."}</p>`; return; }
  const od=o?o[0]:t, den=a=>jeDen?S.sel:(a.datum<od?od:a.datum);
  v.sort((a,b)=>den(a).localeCompare(den(b))||(a.cas||"99").localeCompare(b.cas||"99"));
  if(!S.vseRadky&&v.length>STROP) v=v.slice(0,STROP);
  const skup={}; v.forEach(a=>(skup[den(a)]??=[]).push(a));
  el.innerHTML=Object.entries(skup).map(([d,xs])=>{
    const rel=d===t?"dnes":d===plus(t,1)?"zítra":"";
    return `<div class="dayhead"><h2>${DNY[dow(d)]} <span class="dt">${kratce(d)}</span></h2>
      <span class="n">${[rel,`${xs.length} ${xs.length===1?"akce":xs.length<5?"akce":"akcí"}`].filter(Boolean).join(" · ")}</span></div>
      <div class="list">${xs.map(radek).join("")}</div>`;
  }).join("")+(celkem>v.length?`<p class="nic"><button class="mapbtn" id="vic">Zobrazit zbylých ${celkem-v.length} akcí</button></p>`:"")
    +(dlouhe.length?`<details class="dlouhe"><summary><span class="dayhead"><h2>Probíhá i dál</h2><span class="n">${dlouhe.length} výstav a dlouhodobých akcí</span></span></summary>
      <div class="list">${dlouhe.sort((a,b)=>konec(a).localeCompare(konec(b))).map(radek).join("")}</div></details>`:"");
  const vic=document.getElementById("vic"); if(vic) vic.onclick=()=>{S.vseRadky=true;kreslitSeznam();};
}
function vse(){ S.vseRadky=false; kreslitDny(); if(S.pohled==="kal") kreslitKal(); else kreslitSeznam(); kreslitMapu();
  const n=S.typy.size+(S.misto?1:0)+(S.q?1:0)+(S.hideSold?1:0)+(S.kdy?1:0)+(S.bezGoout?1:0); document.getElementById("nf").textContent=n?`(${n})`:""; }

/* ---------- ovládání ---------- */
function ovladani(){
  const pouz=new Set(AKCE.map(a=>a.typ));
  const ty=document.getElementById("types");
  ty.innerHTML=Object.entries(TYPY).filter(([k])=>pouz.has(k)).map(([k,n])=>
    `<button class="type" data-type="${k}" aria-pressed="${S.typy.has(k)}"><i style="background:var(--c-${k})"></i>${n}</button>`).join("");
  ty.onclick=e=>{const b=e.target.closest(".type");if(!b)return;const k=b.dataset.type;
    S.typy.has(k)?S.typy.delete(k):S.typy.add(k);b.setAttribute("aria-pressed",S.typy.has(k));vse();};
  const sel=document.getElementById("place");
  const mista=[...new Map(AKCE.map(a=>[a.zdroj,a.zdroj===GOOUT?"GoOut (vše)":(a.misto||a.zdroj).split(" – ")[0].split(" (")[0]])).entries()].sort((x,y)=>x[1].localeCompare(y[1],"cs"));
  sel.innerHTML=`<option value="">Všechna místa</option>`+mista.map(([k,n])=>`<option value="${esc(k)}">${esc(n)}</option>`).join("");
  sel.value=S.misto;
  sel.onchange=()=>{S.misto=sel.value;vse();};
  let qT; document.getElementById("q").oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();S.ql=S.q.toLocaleLowerCase("cs");vse();},180);};
  document.getElementById("hideSold").onchange=e=>{S.hideSold=e.target.checked;vse();};
  document.getElementById("bezGoout").onchange=e=>{S.bezGoout=e.target.checked;vse();};
  document.getElementById("when").onchange=e=>{S.kdy=e.target.value;vse();};
  document.getElementById("more").onclick=e=>{const f=document.getElementById("filters");f.classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded",f.classList.contains("open"));};
  const days=document.getElementById("days");
  const zvol=sel=>{ S.sel=sel; if(S.pohled==="kal") prepniPohled("seznam"); else vse(); window.scrollTo({top:0,behavior:"smooth"}); };
  days.onclick=e=>{ if(e.target.closest("[data-pohled]")){ prepniPohled("kal",true); return; }
    const b=e.target.closest("[data-sel]"); if(b) zvol(b.dataset.sel); };
  days.onchange=e=>{if(["pickT","pickM"].includes(e.target.id)&&e.target.value) zvol(e.target.value);};
}

/* ---------- kalendář ----------
   Měsíční mřížka: odstín dne = kolik akcí ten den začíná (podle filtrů), proužek = poměr typů, tečka = nové akce.
   Výstavy a vícedenní akce se do počtu nepočítají (byly by v každém dni) – jsou v programu dne zvlášť. */
const vicedenni=a=>a.konec_datum&&a.konec_datum!==a.datum;
const akci=n=>`${n} ${n===1?"akce":n>1&&n<5?"akce":"akcí"}`;
const mesicPlus=(m,n)=>{const [r,x]=m.split("-").map(Number);const d=new Date(r,x-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;};
const poslDen=()=>AKCE.reduce((m,a)=>a.datum>m?a.datum:m,dnes());
const CASTI=[["Přes den",a=>a.cas&&a.cas<"17:00"],["Večer",a=>a.cas>="17:00"&&a.cas<"21:00"],
  ["Pozdě večer a noc",a=>a.cas>="21:00"],["Čas neuveden",a=>!a.cas]];

function prepniPohled(p, fokus){
  S.pohled=p; const kal=p==="kal";
  document.body.classList.toggle("kal",kal);
  document.getElementById("list").hidden=kal; document.getElementById("kal").hidden=!kal;
  document.getElementById("tabSeznam").setAttribute("aria-selected",!kal);
  document.getElementById("tabKal").setAttribute("aria-selected",kal);
  if(kal){
    const t=dnes(), o=obdobi(S.sel); S.kalDen=o?o[0]:/^\d{4}/.test(S.sel)&&S.sel>=t?S.sel:(S.kalDen&&S.kalDen>=t?S.kalDen:t);
    S.mesic=S.kalDen.slice(0,7);
  }
  try{ localStorage.setItem("pohled",p); }catch(e){}
  try{ history.replaceState(null,"",kal?"#kalendar":location.pathname+location.search); }catch(e){}
  vse();
  if(fokus&&kal) document.querySelector('#kal .kd[tabindex="0"]')?.focus({preventScroll:true});
}

function vyberDen(d, fokus){
  const t=dnes(), posl=poslDen();
  if(d<t) d=t; if(d>posl) d=posl;
  S.kalDen=d; S.sel=d; S.mesic=d.slice(0,7);
  vse();
  if(fokus) document.querySelector(`#kal .kd[data-d="${d}"]`)?.focus({preventScroll:true});
}

function kreslitKal(){
  const el=document.getElementById("kal"), t=dnes(), posl=poslDen();
  if(!S.kalDen) S.kalDen=t; if(!S.mesic) S.mesic=S.kalDen.slice(0,7);
  const [r,m]=S.mesic.split("-").map(Number), dniMes=new Date(r,m,0).getDate();
  const prvni=`${S.mesic}-01`, posledni=`${S.mesic}-${String(dniMes).padStart(2,"0")}`;
  const z=AKCE.filter(zaklad);
  const dny={};
  for(const a of z){
    if(vicedenni(a)||a.datum<prvni||a.datum>posledni) continue;
    const x=(dny[a.datum]??={n:0,typy:{},nove:0}); x.n++; x.typy[a.typ]=(x.typy[a.typ]||0)+1; if(nova(a)) x.nove++;
  }
  const hodnoty=Object.values(dny).map(x=>x.n), max=Math.max(1,...hodnoty), celkem=hodnoty.reduce((s,n)=>s+n,0);
  const nej=Object.entries(dny).sort((a,b)=>b[1].n-a[1].n)[0];
  // odstín: odmocnina, ať jsou rozdíly vidět i mezi slabšími dny; strop 34 % barvy
  const odstin=n=>n?Math.round(6+28*Math.sqrt(n/max)):0;

  let mrizka=`<div class="ktyden kdny" aria-hidden="true">${["po","út","st","čt","pá","so","ne"].map(d=>`<span>${d}</span>`).join("")}</div>`;
  const posun=(dow(prvni)+6)%7; let bunky=[];
  for(let i=0;i<posun;i++) bunky.push(`<span class="kd prazdna" role="gridcell" aria-hidden="true"></span>`);
  for(let den=1;den<=dniMes;den++){
    const d=`${S.mesic}-${String(den).padStart(2,"0")}`, x=dny[d], w=dow(d);
    const mimo=d<t||d>posl, n=x?x.n:0, vyb=d===S.kalDen;
    const typy=x?Object.entries(x.typy).sort((a,b)=>b[1]-a[1]):[];
    const prouzek=typy.map(([k,c])=>`<i style="width:${100*c/n}%;background:var(--c-${k})"></i>`).join("");
    const popis=`${d===t?"dnes, ":d===plus(t,1)?"zítra, ":""}${DNY[w]} ${den}. ${MESG[m-1]}, ${mimo?"bez programu":akci(n)}${x&&x.nove?`, z toho ${x.nove} nových`:""}`;
    bunky.push(`<button class="kd${w===0||w===6?" we":""}${d===t?" dnes":""}" role="gridcell" data-d="${d}" style="--h:${mimo?0:odstin(n)}"
      aria-selected="${vyb}" tabindex="${vyb?0:-1}" aria-label="${popis}" ${mimo?"disabled":""}>
      <span class="kn">${den}</span>${x&&x.nove?`<i class="kx"></i>`:""}
      ${mimo?"":`<span class="kc">${n||"–"}</span><span class="kb">${prouzek}</span>`}</button>`);
  }
  while(bunky.length%7) bunky.push(`<span class="kd prazdna" role="gridcell" aria-hidden="true"></span>`);
  // týdny, které celé proběhly, se nekreslí – mřížka v aktuálním měsíci začíná týdnem s dneškem
  const pondeli=plus(t,-((dow(t)+6)%7));
  for(let i=0;i<bunky.length;i+=7){
    const konecTydne=plus(prvni,i-posun+6);
    if(konecTydne<pondeli) continue;
    mrizka+=`<div class="ktyden kr" role="row">${bunky.slice(i,i+7).join("")}</div>`;
  }

  const legenda=`<div class="klegenda" aria-hidden="true">méně <span class="st">${[0,10,20,34].map(h=>`<i style="background:color-mix(in srgb,var(--accent) ${h}%,var(--panel))"></i>`).join("")}</span> víc akcí
    <i class="kx"></i> nové za týden</div>`;
  const souhrn=celkem?`V ${MESL[m-1]} ${akci(celkem)} · nejvíc ${DNY[dow(nej[0])]} ${kratce(nej[0])} (${nej[1].n})`:"V tomto měsíci nic podle filtrů";

  el.innerHTML=`<div class="khlava">
      <h2>${MESICE[m-1]} <span>${r}</span></h2>
      <div class="knav"><button id="kPred" aria-label="Předchozí měsíc" ${S.mesic<=t.slice(0,7)?"disabled":""}>‹</button>
        <button id="kDal" aria-label="Další měsíc" ${S.mesic>=posl.slice(0,7)?"disabled":""}>›</button></div>
      <button class="kdnes" id="kDnes">Dnes</button>
      <button class="kdnes kmes" id="kMesic" title="Zobrazit všechny akce měsíce jako seznam">Celý ${MESICE[m-1].toLocaleLowerCase("cs")} →</button>
      <span class="ksouhrn">${souhrn}</span></div>
    <div class="kobsah">
      <div class="kmrizka"><div role="grid" aria-label="${MESICE[m-1]} ${r}" id="kGrid">${mrizka}</div>${legenda}</div>
      <div class="kagenda" id="kAgenda">${agendaDne(S.kalDen,z)}</div>
    </div>`;
  el.querySelector("#kPred").onclick=()=>{S.mesic=mesicPlus(S.mesic,-1);const p=`${S.mesic}-01`;vyberDen(p<t?t:p);};
  el.querySelector("#kDal").onclick=()=>{S.mesic=mesicPlus(S.mesic,1);vyberDen(`${S.mesic}-01`);};
  el.querySelector("#kDnes").onclick=()=>vyberDen(t,true);
  el.querySelector("#kMesic").onclick=()=>{ S.sel=`m:${S.mesic}`; prepniPohled("seznam"); window.scrollTo({top:0,behavior:"smooth"}); };
  el.querySelector("#kAgenda .dnav")?.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b) vyberDen(plus(S.kalDen,+b.dataset.k));});
}

function agendaDne(d, z){
  const t=dnes(), v=z.filter(a=>probiha(a,d));
  const jedn=v.filter(a=>!vicedenni(a)).sort((a,b)=>(a.cas||"99").localeCompare(b.cas||"99"));
  const dlouhe=v.filter(vicedenni).sort((a,b)=>konec(a).localeCompare(konec(b)));
  document.getElementById("stav").textContent=`${DNY[dow(d)]} ${kratce(d)}: ${akci(jedn.length)}${dlouhe.length?` a ${dlouhe.length} probíhajících`:""}.`;
  const rel=d===t?"dnes":d===plus(t,1)?"zítra":"";
  let h=`<div class="dayhead"><h2>${DNY[dow(d)]} <span class="dt">${kratce(d)}</span></h2>
    <span class="n">${[rel,akci(jedn.length)].filter(Boolean).join(" · ")}</span>
    <span class="dnav"><button data-k="-1" aria-label="Předchozí den" ${d<=t?"disabled":""}>‹</button><button data-k="1" aria-label="Další den" ${d>=poslDen()?"disabled":""}>›</button></span></div>`;
  if(!jedn.length&&!dlouhe.length) return h+`<p class="nic">Tento den nic – zkus jiný den nebo uvolni filtry.</p>`;
  for(const [nazev,f] of CASTI){
    const xs=jedn.filter(f); if(!xs.length) continue;
    h+=`<h3 class="kg">${nazev} <b>${xs.length}</b></h3><div class="list">${xs.map(radek).join("")}</div>`;
  }
  if(dlouhe.length) h+=`<details${jedn.length?"":" open"}><summary>Probíhá i tento den: výstavy a vícedenní akce <b>${dlouhe.length}</b></summary>
    <div class="list">${dlouhe.map(radek).join("")}</div></details>`;
  return h;
}

function ovladaniKal(){
  document.getElementById("tabSeznam").onclick=()=>prepniPohled("seznam");
  document.getElementById("tabKal").onclick=()=>prepniPohled("kal",true);
  document.querySelector(".pohled").onkeydown=e=>{ if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ e.preventDefault();
    const dalsi=S.pohled==="kal"?"seznam":"kal"; prepniPohled(dalsi); document.getElementById(dalsi==="kal"?"tabKal":"tabSeznam").focus(); } };
  const kal=document.getElementById("kal");
  kal.addEventListener("click",e=>{ const b=e.target.closest(".kd[data-d]"); if(!b||b.disabled) return;
    vyberDen(b.dataset.d, true);
    if(matchMedia("(max-width:900px)").matches) document.getElementById("kAgenda").scrollIntoView({behavior:"smooth",block:"start"}); });
  kal.addEventListener("keydown",e=>{ const b=e.target.closest(".kd[data-d]"); if(!b) return;
    const krok={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    let d=null;
    if(krok) d=plus(b.dataset.d,krok);
    else if(e.key==="Home") d=plus(b.dataset.d,-((dow(b.dataset.d)+6)%7));
    else if(e.key==="End") d=plus(b.dataset.d,6-((dow(b.dataset.d)+6)%7));
    else if(e.key==="PageUp"||e.key==="PageDown"){ const m=mesicPlus(b.dataset.d.slice(0,7),e.key==="PageUp"?-1:1);
      d=`${m}-${String(Math.min(+b.dataset.d.slice(8),new Date(+m.slice(0,4),+m.slice(5),0).getDate())).padStart(2,"0")}`; }
    if(d){ e.preventDefault(); vyberDen(d,true); } });
}

/* ---------- mapa ---------- */
// Přibližné polohy míst. k = klíčová slova (malými písmeny, bez diakritiky), hledají se v "místo + zdroj".
// Slovo s * na konci je začátek slova (dejvick* = dejvické, dejvického…). Pořadí je důležité: konkrétnější místa před obecnými.
const MISTA=[
  {n:"Kino Galaxie (Háje)",k:["galaxie"],p:[50.0306,14.5264]},
  {n:"Jízdárna Pražského hradu",k:["jizdarn*"],p:[50.0927,14.3990]},

  {n:"Skautský institut",k:["skautsk*"],p:[50.0869,14.4208]},
  {n:"Karlínské Spektrum",k:["karlinske spektrum","kis"],p:[50.0928,14.4490]},
  {n:"Kasárna Karlín",k:["kasarna karlin","kasarna"],p:[50.0920,14.4425]},
  {n:"Alfred ve dvoře",k:["alfred"],p:[50.1003,14.4298]},
  {n:"Studio ALTA",k:["alta"],p:[50.1043,14.4339]},
  {n:"Činoherní klub",k:["cinoherni*"],p:[50.0790,14.4283]},
  {n:"Divadlo DISK",k:["disk"],p:[50.0861,14.4167]},
  {n:"Studio Hrdinů",k:["hrdinu"],p:[50.1015,14.4336]},
  {n:"Divadlo Kámen",k:["kamen"],p:[50.0968,14.4640]},
  {n:"Divadlo D21",k:["d21"],p:[50.0738,14.4402]},
  {n:"Divadlo Bez hranic",k:["bez hranic"],p:[50.0645,14.4312]},

  {n:"Viničná 7 (Biologické čtvrtky)",k:["vinicn*","bioctvrtky"],p:[50.0712,14.4228]},

];
const bezd=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const kl=new Map();
function poloha(a){
  const t=` ${bezd(a.misto)} ${a.zdroj===GOOUT?"":a.zdroj} `;
  if(kl.has(t)) return kl.get(t);
  if(a.poloha){ const m={n:(a.misto||"").split(" – ")[0],p:a.poloha}; kl.set(t,m); return m; }
  const m=MISTA.find(m=>m.k.some(k=>new RegExp(k.endsWith("*")?`(^|[^a-z0-9])${k.slice(0,-1)}`:`(^|[^a-z0-9])${k}($|[^a-z0-9])`).test(t)))||null;
  kl.set(t,m); return m;
}
let MAPA=null, VRSTVA=null;
function nactiLeaflet(){
  return new Promise((ok,chyba)=>{
    if(window.L) return ok();
    const c=document.createElement("link"); c.rel="stylesheet";
    c.href="vendor/leaflet/leaflet.css"; document.head.appendChild(c);
    const s=document.createElement("script"); s.src="vendor/leaflet/leaflet.js";
    s.onload=ok; s.onerror=chyba; document.head.appendChild(s);
  });
}
function kreslitMapu(){
  if(!MAPA||document.getElementById("mapa").hidden) return;
  const v=AKCE.filter(a=>zaklad(a)&&vyber(a)), sk=new Map(); let bez=0;
  v.forEach(a=>{const m=poloha(a); if(!m){bez++;return;} if(!sk.has(m)) sk.set(m,[]); sk.get(m).push(a);});
  VRSTVA.clearLayers();
  const t=dnes();
  sk.forEach((xs,m)=>{
    xs.sort((a,b)=>(a.datum<t?t:a.datum).localeCompare(b.datum<t?t:b.datum)||(a.cas||"99").localeCompare(b.cas||"99"));
    const r=Math.round(Math.min(40,20+Math.sqrt(xs.length)*3));
    const ik=L.divIcon({className:"",html:`<div class="pin" style="width:${r}px;height:${r}px">${xs.length}</div>`,iconSize:[r,r],iconAnchor:[r/2,r/2]});
    const html=`<h4>${esc(m.n)}</h4><ul>${xs.slice(0,15).map(a=>`<li><span class="mono">${kratce(a.datum<t?t:a.datum)} ${a.cas||""}</span><a href="${odkaz(a.url||a.vstupenky)}" target="_blank" rel="noopener">${esc(a.nazev)}</a></li>`).join("")}${xs.length>15?`<li>… a dalších ${xs.length-15}</li>`:""}</ul>`;
    L.marker(m.p,{icon:ik,title:m.n}).bindPopup(html,{maxWidth:300}).addTo(VRSTVA);
  });
  const vyb=popisVyberu();
  document.getElementById("mapinfo").textContent=`${v.length-bez} akcí na ${sk.size} místech · ${vyb}, podle filtrů${bez?` · ${bez} bez polohy`:""} · polohy jsou přibližné`;
}
async function otevritMapu(){
  const w=document.getElementById("mapa"); w.hidden=false; document.body.style.overflow="hidden";
  document.querySelector(".page").inert=true; document.getElementById("mapClose").focus();
  try{ await nactiLeaflet(); }catch(e){ document.getElementById("mapinfo").textContent="Mapu se nepodařilo načíst."; return; }
  if(!MAPA){
    MAPA=L.map("mapel",{zoomControl:true}).setView([50.087,14.43],13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAPA);
    VRSTVA=L.layerGroup().addTo(MAPA);
  }
  setTimeout(()=>MAPA.invalidateSize(),0);
  kreslitMapu();
}
function zavritMapu(){ const w=document.getElementById("mapa"); if(w.hidden) return; w.hidden=true; document.body.style.overflow="";
  document.querySelector(".page").inert=false; document.getElementById("mapBtn").focus(); }
document.getElementById("mapBtn").onclick=otevritMapu;
document.getElementById("mapClose").onclick=zavritMapu;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") zavritMapu(); });

/* Data jsou rozdělená po týdnech (nastroje/rozdel.py): nejdřív přehled a nejbližší týdny, zbytek se dočte na pozadí. */
const nacti=u=>fetch("data/"+u,{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });
function popisMeta(scen, celkem, stav){
  const kdy=META.vygenerovano?new Date(META.vygenerovano).toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):"?";
  document.getElementById("meta").textContent=`${celkem} akcí · ${scen} zdrojů · aktualizováno ${kdy}${stav?` · ${stav}`:""}`;
}
async function start(){
  try{
    const [p,z]=await Promise.all([nacti("prehled.json"), nacti("zdravi.json").catch(()=>({}))]);
    META=p.meta||{};
    const t=dnes(), scen=Object.keys(z).length, hranice=plus(t,7);
    const pridej=d=>{ AKCE=AKCE.concat((d.akce||[]).filter(a=>konec(a)>=t)); };
    const casti=(p.casti||[]).filter(c=>c.do>=t);
    const brzy=casti.filter(c=>c.od<=hranice), pozdeji=casti.filter(c=>c.od>hranice);
    (await Promise.all([nacti(p.prubezne.soubor), ...brzy.map(c=>nacti(c.soubor))])).forEach(pridej);
    S.sel=t;
    ovladani(); ovladaniKal();
    let chci="seznam"; try{ chci=location.hash==="#kalendar"?"kal":(localStorage.getItem("pohled")||"seznam"); }catch(e){}
    if(chci==="kal") prepniPohled("kal"); else vse();
    popisMeta(scen, p.celkem, pozdeji.length?"načítám další týdny…":"");
    const zpr=[], stari=META.vygenerovano?(Date.now()-new Date(META.vygenerovano))/36e5:999;
    if(stari>30) zpr.push(`<b>Data nejsou čerstvá</b> – poslední sběr proběhl před ${Math.round(stari/24)} dny.`);
    const spatne=Object.values(z).filter(x=>x.hlasit);   // jednodenní výpadek cizího webu se neukazuje
    if(spatne.length) zpr.push(`<b>Nefunguje:</b> ${spatne.map(x=>`${esc(x.nazev)} (${esc(x.chyba||x.varovani)})`).join(", ")}`);
    if(zpr.length){const al=document.getElementById("alert");al.innerHTML=zpr.join("<br>");al.hidden=false;}
    document.getElementById("sources").innerHTML=Object.values(z).sort((a,b)=>a.nazev.localeCompare(b.nazev,"cs")).map(s=>
      `<li class="${s.ok?"":"bad"}"><a href="${odkaz(s.url)}" target="_blank" rel="noopener">${esc(s.nazev)}</a> <span class="mono">${s.ok?s.pocet:"✕"}</span>${s.goout&&s.goout.z?` <span class="mono go" title="Z ${s.goout.z} akcí v příštích 3 týdnech jich ${s.goout.shoda} má i GoOut">GoOut ${Math.round(100*s.goout.shoda/s.goout.z)} %</span>`:""}</li>`).join("");
    if(pozdeji.length){
      const vysl=await Promise.allSettled(pozdeji.map(c=>nacti(c.soubor)));
      vysl.forEach(v=>{ if(v.status==="fulfilled") pridej(v.value); });
      const chybi=vysl.filter(v=>v.status!=="fulfilled").length;
      const radky=S.vseRadky; ovladani(); vse(); if(radky){ S.vseRadky=true; kreslitSeznam(); }
      popisMeta(scen, chybi?AKCE.length:p.celkem, chybi?"část programu se nenačetla, zkus obnovit stránku":"");
    }
  }catch(e){ document.getElementById("meta").textContent="Program se nepodařilo načíst."; console.error(e); }
}
start();
