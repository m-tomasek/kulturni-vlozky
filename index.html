<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulturní vložky</title>
<meta name="description" content="Program menších pražských scén na jednom místě.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokeny ---------- */
:root{
  --surface:#FAF8F4;        /* papír */
  --surface-raised:#FFFFFF;
  --ink:#24211D;            /* hlavní text */
  --ink-muted:#7D776E;      /* vedlejší text */
  --rule:#E6E0D6;           /* linky */
  --rule-strong:#CFC7BA;
  --signal:#C4553E;         /* jediný sytý akcent: nové, dnešek */
  --focus:#3D6F9E;

  /* pastely = typy akcí */
  --t-divadlo:#F5D3CB;  --t-improvizace:#F9E3A1; --t-koncert:#CBDFF1;
  --t-tanec:#DCD5EE;    --t-prednaska:#D2E8D9;   --t-vystava:#F2DCC3;
  --t-festival:#F6D0DF; --t-film:#D7DCE4;        --t-spolecenska:#E3EAC4;
  --t-jine:#E9E4DC;

  --sold:#B3483A; --free:#3F7A55; --warn:#9A6A12;

  --step--1:clamp(.78rem,.16vw + .74rem,.86rem);
  --step-0:clamp(.95rem,.25vw + .89rem,1.06rem);
  --step-1:clamp(1.15rem,.5vw + 1.03rem,1.4rem);
  --step-2:clamp(1.5rem,1.1vw + 1.25rem,2.1rem);
  --step-4:clamp(2.6rem,4.2vw + 1.6rem,5rem);

  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Schibsted Grotesk","Helvetica Neue",Helvetica,sans-serif;
}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#191816; --surface-raised:#211F1C; --ink:#EDE8E1; --ink-muted:#9B948A;
    --rule:#2F2C28; --rule-strong:#45403A; --signal:#E8846D; --focus:#8DB6DD;
    --t-divadlo:#E9B9AE; --t-improvizace:#EDD27F; --t-koncert:#A9C8E6; --t-tanec:#C4B8E6;
    --t-prednaska:#AFD6BC; --t-vystava:#E6C49E; --t-festival:#EBB1C9; --t-film:#B9C1CE;
    --t-spolecenska:#CDD99B; --t-jine:#8E877D;
    --sold:#E68A7C; --free:#86C39C; --warn:#D9B05E;
  }
}

/* ---------- základ ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:400 var(--step-0)/1.5 var(--sans);
  font-feature-settings:"ss01";-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.page{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,48px) 16px 80px}

/* ---------- hlavička: asymetrická, zarovnaná dolů ---------- */
.masthead{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px 32px;
  padding-bottom:20px;border-bottom:1px solid var(--ink)}
.masthead h1{font:400 var(--step-4)/.9 var(--serif);letter-spacing:-.02em;margin:0}
.masthead h1 em{font-style:italic}
.masthead p{margin:0;color:var(--ink-muted);font-size:var(--step--1);text-align:right;max-width:24ch}

/* ---------- rozvržení ---------- */
.layout{display:grid;grid-template-columns:340px 1fr;gap:0 56px;margin-top:28px}
.side{position:sticky;top:20px;align-self:start}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;margin-bottom:28px}
  .masthead{grid-template-columns:1fr}
  .masthead p{text-align:left;max-width:none}
}

/* ---------- kalendář ---------- */
.cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font:400 var(--step-2)/1 var(--serif);margin:0;text-transform:lowercase}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:32px;height:32px;border-radius:4px;color:var(--ink-muted);font-size:18px}
.cal-nav button:hover{background:var(--rule);color:var(--ink)}
.cal-nav button:disabled{opacity:.25;cursor:default;background:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule)}
.cal .wd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);
  padding:8px 0 6px;text-align:left}
.day{position:relative;min-width:0;height:52px;border-top:1px solid var(--rule);padding:5px 4px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;border-radius:0}
.day .d{font-size:var(--step--1);font-variant-numeric:tabular-nums;line-height:1}
.day .dots{display:flex;flex-wrap:wrap;gap:2px;min-height:5px;max-width:42px}
.day .dots i{width:5px;height:5px;border-radius:50%;display:block}
.day.out{visibility:hidden}
.day.past .d,.day.none .d{color:var(--rule-strong)}
.day.none{cursor:default}
.day:not(.none):hover{background:var(--rule)}
.day.today .d{color:var(--signal);font-weight:600}
.day.sel{background:var(--ink);color:var(--surface)}
.day.sel:hover{background:var(--ink)}
.day.inrange:not(.sel){background:color-mix(in srgb,var(--ink) 7%,transparent)}

/* ---------- legenda = filtr typů ---------- */
.legend{margin-top:26px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.type{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:3px;
  font-size:var(--step--1);background:transparent;border:1px solid var(--rule);transition:background .15s}
.type i{width:9px;height:9px;border-radius:50%}
.type:hover{border-color:var(--rule-strong)}
.type[aria-pressed="true"]{background:var(--sw);border-color:transparent}
.type[aria-pressed="true"]{color:#24211D}
.types.filtering .type[aria-pressed="false"]{color:var(--ink-muted)}
details.filters>summary{list-style:none;cursor:pointer;margin-top:22px;font-size:var(--step--1);color:var(--ink-muted);display:none}
details.filters>summary::-webkit-details-marker{display:none}
@media (max-width:860px){details.filters>summary{display:block;border-top:1px solid var(--rule);padding-top:12px}
  details.filters>summary::after{content:" ↓"} details.filters[open]>summary::after{content:" ↑"}}
.side-tools{margin-top:22px;display:grid;gap:10px}
.side-tools select,.side-tools input[type=search]{width:100%;font:inherit;font-size:var(--step--1);padding:8px 10px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface-raised);color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:var(--step--1);color:var(--ink-muted);cursor:pointer}
.toggle input{accent-color:var(--ink)}

/* ---------- přepínač pohledů ---------- */
.views{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:6px}
.view{padding:2px 0 10px;font-size:var(--step-0);color:var(--ink-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.view:hover{color:var(--ink)}
.view[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view sup{font-size:10px;margin-left:2px;font-variant-numeric:tabular-nums}
.view.has-new sup{color:var(--signal)}

/* ---------- seznam ---------- */
.dayhead{display:flex;align-items:baseline;gap:12px;margin:34px 0 4px;position:sticky;top:0;
  background:var(--surface);padding:8px 0 6px;z-index:2;border-bottom:1px solid var(--ink)}
.dayhead h3{font:400 var(--step-2)/1.1 var(--serif);margin:0}
.dayhead span{color:var(--ink-muted);font-size:var(--step--1)}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:2px 18px;padding:14px 0;border-bottom:1px solid var(--rule)}
.ev .time{font-variant-numeric:tabular-nums;font-weight:500;padding-top:1px}
.ev .time small{display:block;color:var(--ink-muted);font-weight:400;font-size:var(--step--1)}
.ev h4{margin:0;font:500 var(--step-1)/1.25 var(--sans);letter-spacing:-.005em}
.ev h4 a{text-decoration:none}
.ev h4 a:hover{text-decoration:underline}
.ev .where{color:var(--ink-muted);font-size:var(--step--1);margin-top:2px}
.ev .flags{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:var(--step--1)}
.tag{display:inline-flex;align-items:center;gap:6px}
.tag i{width:8px;height:8px;border-radius:50%}
.flag-new{color:var(--signal);font-weight:600}
.flag-sold{color:var(--sold)}
.flag-free{color:var(--free)}
.flag-warn{color:var(--warn)}
.ev .acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:var(--step--1);white-space:nowrap}
.ev .acts a,.ev .acts button{color:var(--ink-muted);text-decoration:underline;text-decoration-color:var(--rule-strong)}
.ev .acts a:hover,.ev .acts button:hover{color:var(--ink);text-decoration-color:currentColor}
.ev .acts .cal-add{color:var(--ink);text-decoration-color:var(--ink)}
.ev.cancel h4,.ev.cancel .time{text-decoration:line-through;color:var(--ink-muted)}
.ev.hidden{opacity:.45}
@media (max-width:560px){
  .ev{grid-template-columns:52px 1fr;gap:2px 12px}
  .ev .acts{grid-column:2;flex-direction:row;justify-content:flex-start;gap:16px;margin-top:8px}
}
.list-empty{padding:48px 0;color:var(--ink-muted);font:400 var(--step-1)/1.4 var(--serif);font-style:italic}

/* ---------- patička ---------- */
.health{margin-top:72px;padding-top:16px;border-top:1px solid var(--rule);font-size:var(--step--1);color:var(--ink-muted);
  display:grid;grid-template-columns:340px 1fr;gap:0 56px}
.health ul{list-style:none;margin:0;padding:0;columns:2;column-gap:32px}
.health li{break-inside:avoid;padding:2px 0}
.health .bad{color:var(--sold)}
@media (max-width:860px){.health{grid-template-columns:1fr}.health ul{columns:1}}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1>Kulturní <em>vložky</em></h1>
    <p id="meta">Načítám program…</p>
  </header>

  <div class="layout">
    <aside class="side" aria-label="Kalendář a filtry">
      <div class="cal-head">
        <h2 id="calTitle">—</h2>
        <div class="cal-nav">
          <button id="prev" aria-label="Předchozí měsíc">‹</button>
          <button id="next" aria-label="Další měsíc">›</button>
        </div>
      </div>
      <div class="cal" id="cal" role="grid"></div>

      <details class="filters" id="filters" open>
      <summary>Filtry: typ, místo, hledání</summary>
      <div class="legend">
        <p class="label">Typ akce</p>
        <div class="types" id="types"></div>
      </div>

      <div class="side-tools">
        <input type="search" id="q" placeholder="Hledat název nebo místo" aria-label="Hledat">
        <select id="place" aria-label="Místo"><option value="">Všechna místa</option></select>
        <label class="toggle"><input type="checkbox" id="hideSold"> skrýt vyprodané</label>
        <label class="toggle"><input type="checkbox" id="showHidden"> ukázat, co jsem skryl</label>
      </div>
      </details>
    </aside>

    <main>
      <nav class="views" id="views" role="tablist" aria-label="Pohled"></nav>
      <div id="list"></div>
    </main>
  </div>

  <footer class="health">
    <p class="label">Zdroje</p>
    <ul id="sources"></ul>
  </footer>
</div>

<script>
const TYPY = {divadlo:"Divadlo",improvizace:"Impro",koncert:"Koncert",tanec:"Tanec a performance",
  prednaska:"Přednáška a debata",vystava:"Výstava",festival:"Festival",film:"Film",spolecenska:"Společenské",jine:"Jiné"};
const DNY = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
const MES = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const MES2 = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];

const S = {view:"vse", den:null, typy:new Set(), misto:"", q:"", hideSold:false, showHidden:false, mesic:null};
let AKCE=[], META={}, SKRYTE=new Set();

/* ---------- pomůcky ---------- */
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null} }
try{ SKRYTE=new Set(JSON.parse(store("kv-skryte")||"[]")); }catch(e){}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dnes=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Prague"}).format(new Date());
const plus=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dow=d=>new Date(d+"T12:00:00").getDay();
const kratce=d=>`${+d.slice(8)}. ${+d.slice(5,7)}.`;
const konec=a=>a.konec_datum||a.datum;
const probiha=(a,d)=>a.datum<=d && konec(a)>=d;

function nova7(a){ return a.poprve_videno!==META.zalozeno && a.poprve_videno>=plus(dnes(),-7); }
function novaOdMinula(a){ return META.predchozi_beh && a.poprve_videno!==META.zalozeno && a.poprve_videno>=META.predchozi_beh.slice(0,10); }

function vikend(){
  const t=dnes(), w=dow(t);
  const pa = w===0 ? plus(t,-2) : w===6 ? plus(t,-1) : plus(t,5-w);
  return [pa, plus(pa,1), plus(pa,2)];
}

/* ---------- filtry ---------- */
function zakladFiltr(a){
  if(!S.showHidden && SKRYTE.has(a.id)) return false;
  if(S.typy.size && !S.typy.has(a.typ)) return false;
  if(S.misto && a.zdroj!==S.misto) return false;
  if(S.hideSold && a.stav==="vyprodano") return false;
  if(S.q){ const q=S.q.toLocaleLowerCase("cs"); if(!`${a.nazev} ${a.misto} ${a.znacky||""}`.toLocaleLowerCase("cs").includes(q)) return false; }
  return true;
}
function vPohledu(a, view=S.view){
  const t=dnes();
  switch(view){
    case "nove": return nova7(a);
    case "dnes": return probiha(a,t);
    case "zitra": return probiha(a,plus(t,1));
    case "vikend": { const [pa,so,ne]=vikend();
      return (probiha(a,pa) && (a.cas||"00:00")>="17:00") || probiha(a,so) || probiha(a,ne); }
    case "den": return probiha(a,S.den);
    default: return true;
  }
}

/* ---------- odkaz do Google Kalendáře ---------- */
function gcal(a){
  const p=new URLSearchParams({action:"TEMPLATE",text:a.nazev,ctz:"Europe/Prague",location:a.misto||""});
  const d=a.datum.replaceAll("-",""), pad=n=>String(n).padStart(2,"0");
  if(!a.cas){ p.set("dates",`${d}/${plus(konec(a),1).replaceAll("-","")}`); }
  else{
    let [h,m]=a.cas.split(":").map(Number), kd=konec(a), kh, km;
    if(a.konec_cas){[kh,km]=a.konec_cas.split(":").map(Number);} else {kh=h+2;km=m;if(kh>=24){kh-=24;kd=plus(kd,1);}}
    p.set("dates",`${d}T${pad(h)}${pad(m)}00/${kd.replaceAll("-","")}T${pad(kh)}${pad(km)}00`);
  }
  p.set("details",[a.url&&`Info: ${a.url}`, a.vstupenky&&a.vstupenky!==a.url&&`Vstupenky: ${a.vstupenky}`, a.cena&&`Cena: ${a.cena}`].filter(Boolean).join("\n"));
  return "https://calendar.google.com/calendar/render?"+p;
}

/* ---------- kalendář ---------- */
function mesice(){
  const t=dnes(), posl=AKCE.reduce((m,a)=>a.datum>m?a.datum:m,t);
  const out=[]; let y=+t.slice(0,4), m=+t.slice(5,7)-1;
  const [ky,km]=[+posl.slice(0,4), +posl.slice(5,7)-1];
  while(y<ky || (y===ky && m<=km)){ out.push([y,m]); m++; if(m>11){m=0;y++;} }
  return out;
}
function kreslitKalendar(){
  const ms=mesice(); const i=Math.max(0,Math.min(S.mesic,ms.length-1)); S.mesic=i;
  const [y,m]=ms[i];
  document.getElementById("calTitle").textContent = `${MES[m]}${y!==+dnes().slice(0,4)?" "+y:""}`;
  document.getElementById("prev").disabled = i===0;
  document.getElementById("next").disabled = i===ms.length-1;

  const zaklad=AKCE.filter(zakladFiltr), t=dnes();
  const prvni=`${y}-${String(m+1).padStart(2,"0")}-01`;
  const posun=(dow(prvni)+6)%7;
  const dniVMes=new Date(y,m+1,0).getDate();
  const rozsah = S.view==="den" ? [S.den] : S.view==="dnes" ? [t] : S.view==="zitra" ? [plus(t,1)] : S.view==="vikend" ? vikend() : [];
  let html=["po","út","st","čt","pá","so","ne"].map(d=>`<div class="wd">${d}</div>`).join("");
  for(let k=0;k<posun;k++) html+=`<div class="day out" aria-hidden="true"></div>`;
  for(let d=1; d<=dniVMes; d++){
    const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const den=zaklad.filter(a=>probiha(a,iso));
    const cls=["day", iso<t?"past":"", !den.length?"none":"", iso===t?"today":"",
      S.view==="den"&&S.den===iso?"sel":"", S.view!=="den"&&rozsah.includes(iso)?"inrange":""].join(" ");
    const label=`${DNY[dow(iso)]} ${d}. ${MES2[m]}: ${den.length} akcí`;
    html+=`<button class="${cls}" data-day="${iso}" aria-label="${label}" ${!den.length?"disabled":""}>
      <span class="d">${d}</span>
      <span class="dots">${den.slice(0,14).map(a=>`<i style="background:var(--t-${a.typ})"></i>`).join("")}</span></button>`;
  }
  document.getElementById("cal").innerHTML=html;
}

/* ---------- pohledy ---------- */
const POHLEDY=[["nove","Nové"],["dnes","Dnes"],["zitra","Zítra"],["vikend","Víkend"],["vse","Vše"]];
function kreslitPohledy(){
  const zaklad=AKCE.filter(zakladFiltr);
  let html=POHLEDY.map(([k,n])=>{
    const c=zaklad.filter(a=>vPohledu(a,k)).length;
    return `<button class="view ${k==="nove"&&c?"has-new":""}" role="tab" data-view="${k}" aria-selected="${S.view===k}">${n}<sup>${c}</sup></button>`;
  }).join("");
  if(S.view==="den") html+=`<button class="view" role="tab" aria-selected="true">${DNY[dow(S.den)]} ${kratce(S.den)}</button>`;
  document.getElementById("views").innerHTML=html;
}

/* ---------- seznam ---------- */
function radek(a){
  const flags=[];
  if(novaOdMinula(a)||(S.view==="nove")) flags.push(`<span class="flag-new">nové</span>`);
  if(a.stav==="vyprodano") flags.push(`<span class="flag-sold">vyprodáno</span>`);
  else if(a.stav==="posledni") flags.push(`<span class="flag-warn">poslední vstupenky</span>`);
  else if(a.stav==="volno") flags.push(`<span class="flag-free">vstupenky v prodeji</span>`);
  if(a.stav==="zruseno") flags.push(`<span class="flag-sold">zrušeno</span>`);
  else if((a.chybi_behu||0)>=2) flags.push(`<span class="flag-warn">zrušeno?</span>`);
  (a.zmeny||[]).slice(0,1).forEach(z=>flags.push(`<span class="flag-warn">${esc(z.co)}, ${kratce(z.kdy)}</span>`));
  flags.push(`<span class="tag"><i style="background:var(--t-${a.typ})"></i>${TYPY[a.typ]||a.typ}</span>`);
  if(a.cena) flags.push(`<span>${esc(a.cena)}</span>`);

  const viceDni=a.konec_datum && a.konec_datum!==a.datum;
  const cas = a.cas || (viceDni ? "celý den" : "—");
  const pod = viceDni ? `<small>do ${kratce(a.konec_datum)}</small>` : a.konec_cas ? `<small>–${a.konec_cas}</small>` : "";
  const skryta=SKRYTE.has(a.id);
  return `<article class="ev ${a.stav==="zruseno"?"cancel":""} ${skryta?"hidden":""}">
    <div class="time">${cas}${pod}</div>
    <div>
      <h4><a href="${esc(a.url||a.vstupenky||"#")}" target="_blank" rel="noopener">${esc(a.nazev)}</a></h4>
      <div class="where">${esc(a.misto||"")}${a.znacky?` · ${esc(a.znacky)}`:""}</div>
      <div class="flags">${flags.join("")}</div>
    </div>
    <div class="acts">
      <a class="cal-add" href="${gcal(a)}" target="_blank" rel="noopener">do kalendáře</a>
      ${a.vstupenky?`<a href="${esc(a.vstupenky)}" target="_blank" rel="noopener">vstupenky</a>`:""}
      <button data-hide="${a.id}">${skryta?"vrátit":"skrýt"}</button>
    </div>
  </article>`;
}
function kreslitSeznam(){
  const t=dnes();
  const vyber=AKCE.filter(a=>zakladFiltr(a)&&vPohledu(a));
  const el=document.getElementById("list");
  if(!vyber.length){
    el.innerHTML=`<p class="list-empty">${S.view==="nove"?"Za posledních sedm dní nikdo nic nového nevypsal.":"Tady je prázdno. Zkus jiný den nebo uvolni filtry."}</p>`;
    return;
  }
  let html="", posl="";
  const den=a=> S.view==="den" ? S.den : (a.datum<t ? t : a.datum);
  vyber.sort((a,b)=>den(a).localeCompare(den(b)) || (a.cas||"99").localeCompare(b.cas||"99"));
  for(const a of vyber){
    const d=den(a);
    if(d!==posl){
      const n=vyber.filter(x=>den(x)===d).length;
      const rel = d===t?"dnes" : d===plus(t,1)?"zítra" : "";
      html+=`<div class="dayhead"><h3>${DNY[dow(d)]} ${+d.slice(8)}. ${MES2[+d.slice(5,7)-1]}</h3><span>${[rel,`${n} ${n===1?"akce":n<5?"akce":"akcí"}`].filter(Boolean).join(" · ")}</span></div>`;
      posl=d;
    }
    html+=radek(a);
  }
  el.innerHTML=html;
}

function vse(){ kreslitPohledy(); kreslitKalendar(); kreslitSeznam(); }

/* ---------- ovládání ---------- */
function ovladani(){
  const pouzite=new Set(AKCE.map(a=>a.typ));
  const typesEl=document.getElementById("types");
  typesEl.innerHTML=Object.entries(TYPY).filter(([k])=>pouzite.has(k)).map(([k,n])=>
    `<button class="type" style="--sw:var(--t-${k})" data-type="${k}" aria-pressed="false"><i style="background:var(--t-${k})"></i>${n}</button>`).join("");
  typesEl.onclick=e=>{const b=e.target.closest(".type"); if(!b)return;
    const k=b.dataset.type; S.typy.has(k)?S.typy.delete(k):S.typy.add(k);
    b.setAttribute("aria-pressed",S.typy.has(k)); typesEl.classList.toggle("filtering",S.typy.size>0); vse();};

  const sel=document.getElementById("place");
  const mista=[...new Map(AKCE.map(a=>[a.zdroj,(a.misto||a.zdroj).split(" – ")[0].split(" (")[0]])).entries()]
    .sort((x,y)=>x[1].localeCompare(y[1],"cs"));
  sel.innerHTML+=mista.map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join("");
  sel.onchange=()=>{S.misto=sel.value;vse();};
  document.getElementById("q").oninput=e=>{S.q=e.target.value.trim();vse();};
  document.getElementById("hideSold").onchange=e=>{S.hideSold=e.target.checked;vse();};
  document.getElementById("showHidden").onchange=e=>{S.showHidden=e.target.checked;vse();};
  document.getElementById("prev").onclick=()=>{S.mesic--;kreslitKalendar();};
  document.getElementById("next").onclick=()=>{S.mesic++;kreslitKalendar();};
  document.getElementById("cal").onclick=e=>{const b=e.target.closest(".day[data-day]"); if(!b||b.disabled)return;
    if(S.view==="den"&&S.den===b.dataset.day){S.view="vse";S.den=null;} else {S.view="den";S.den=b.dataset.day;}
    vse(); if(innerWidth<=860) document.getElementById("views").scrollIntoView({behavior:"smooth"});};
  document.getElementById("views").onclick=e=>{const b=e.target.closest(".view[data-view]"); if(!b)return;
    S.view=b.dataset.view; S.den=null; vse();};
  document.getElementById("list").onclick=e=>{const b=e.target.closest("[data-hide]"); if(!b)return;
    const id=b.dataset.hide; SKRYTE.has(id)?SKRYTE.delete(id):SKRYTE.add(id);
    store("kv-skryte",JSON.stringify([...SKRYTE])); vse();};
}

/* ---------- start ---------- */
async function start(){
  try{
    const [d,z]=await Promise.all([
      fetch("data/akce.json",{cache:"no-store"}).then(r=>r.json()),
      fetch("data/zdravi.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}))]);
    META=d.meta||{}; AKCE=(d.akce||[]).filter(a=>konec(a)>=dnes());
    const kdy=META.vygenerovano?new Date(META.vygenerovano).toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):"?";
    const zdroju=Object.keys(z).length;
    document.getElementById("meta").innerHTML=`${AKCE.length} akcí z ${zdroju} menších pražských scén.<br>Aktualizováno ${kdy}.`;
    S.mesic=0;
    if(innerWidth<=860) document.getElementById("filters").removeAttribute("open");
    if(AKCE.some(a=>zakladFiltr(a)&&nova7(a))) S.view="nove";
    ovladani(); vse();
    document.getElementById("sources").innerHTML=Object.values(z).sort((a,b)=>a.nazev.localeCompare(b.nazev,"cs")).map(s=>
      `<li class="${s.ok?"":"bad"}"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nazev)}</a> ${s.ok?`<span class="num">${s.pocet}</span>`:"— nefunguje"}</li>`).join("");
  }catch(e){
    document.getElementById("meta").textContent="Program se nepodařilo načíst.";
    console.error(e);
  }
}
start();
</script>
