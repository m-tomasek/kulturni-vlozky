<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulturní vložky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--panel:#fffdf9;--ink:#1e1b18;--soft:#6b635b;--line:#e6dfd5;
  --accent:#c2410c;--accent-soft:#fde9dc;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--new:#1d4ed8;--new-soft:#e0e9ff;
  --chip:#efe9e0;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161412;--panel:#1f1c19;--ink:#f1ece6;--soft:#a39a90;--line:#332e29;
    --accent:#fb923c;--accent-soft:#3a2416;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--new:#93b4ff;--new-soft:#1c2647;--chip:#2a2622}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header h1{font:700 34px/1.1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
.sub{color:var(--soft);font-size:13px;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 12px}
.tab{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;cursor:pointer;font:500 14px Inter,sans-serif;color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.6;margin-left:4px;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:5px 11px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
select,input[type=search]{font:14px Inter,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
label.chk{font-size:13px;color:var(--soft);display:flex;gap:5px;align-items:center;cursor:pointer}
.den{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:24px 0 8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.den b{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:56px 1fr;gap:4px 12px}
.card.zrus{opacity:.55}
.card.zrus .t{text-decoration:line-through}
.cas{font:600 15px Inter,sans-serif;padding-top:1px}
.cas small{display:block;font-weight:400;color:var(--soft);font-size:11px}
.t{font:600 16px/1.3 Inter,sans-serif;text-decoration:none}
.t:hover{text-decoration:underline}
.meta{color:var(--soft);font-size:13px;margin-top:2px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.b{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--soft)}
.b.new{background:var(--new-soft);color:var(--new)}
.b.sold{background:#fee2e2;color:var(--bad)}
.b.last{background:#fef3c7;color:var(--warn)}
.b.free{background:#dcfce7;color:var(--ok)}
.b.chg{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme: dark){.b.sold{background:#3b1717}.b.last{background:#3a2c10}.b.free{background:#123220}}
.acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{font:500 13px Inter,sans-serif;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{color:var(--soft)}
.empty{color:var(--soft);padding:30px 0;text-align:center}
.zdravi{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--soft)}
.zdravi h2{font:600 14px Inter,sans-serif;color:var(--ink);margin:0 0 8px}
.zdravi ul{list-style:none;padding:0;margin:0;columns:2;column-gap:20px}
.zdravi li{margin-bottom:3px;break-inside:avoid}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.x{background:var(--bad)}
@media (max-width:560px){.zdravi ul{columns:1}header h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kulturní <span>vložky</span></h1>
    <div class="sub" id="sub">Načítám…</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="filters" id="typy"></div>
  <div class="row2">
    <input type="search" id="hledat" placeholder="Hledat název nebo místo…">
    <select id="misto"><option value="">Všechna místa</option></select>
    <label class="chk"><input type="checkbox" id="jenVolne"> skrýt vyprodané</label>
    <label class="chk"><input type="checkbox" id="ukazSkryte"> ukázat skryté</label>
  </div>

  <main id="seznam"></main>

  <section class="zdravi">
    <h2>Stav zdrojů</h2>
    <ul id="zdroje"></ul>
  </section>
</div>

<script>
const TYPY = {divadlo:"Divadlo",improvizace:"Impro",koncert:"Koncert",tanec:"Tanec & performance",
  prednaska:"Přednáška & debata",vystava:"Výstava",festival:"Festival",film:"Film",spolecenska:"Společenské",jine:"Jiné"};
const DNY = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
const S = {tab:"vse", typy:new Set(), misto:"", q:"", jenVolne:false, ukazSkryte:false};
let AKCE = [], META = {}, SKRYTE = new Set();

function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null} }
try{ SKRYTE = new Set(JSON.parse(ls("kv-skryte")||"[]")); }catch(e){}
function ulozSkryte(){ ls("kv-skryte", JSON.stringify([...SKRYTE])); }

const iso = d => d.toISOString().slice(0,10);
function datumPraha(){ const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Prague"}).format(new Date()); return p; }
function plus(isoD, n){ const d=new Date(isoD+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function fmtDen(isoD){ const d=new Date(isoD+"T12:00:00"); return `<b>${DNY[d.getDay()]}</b> ${d.getDate()}. ${d.getMonth()+1}.`; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function jeNova(a){
  if(!META.predchozi_beh) return false;
  if(a.poprve_videno === META.zalozeno) return false;
  return a.poprve_videno >= META.predchozi_beh.slice(0,10);
}
function nova7(a){ return a.poprve_videno !== META.zalozeno && a.poprve_videno >= plus(datumPraha(),-7); }

function kalendarOdkaz(a){
  const p = new URLSearchParams();
  p.set("action","TEMPLATE"); p.set("text", a.nazev); p.set("ctz","Europe/Prague");
  const d = a.datum.replaceAll("-","");
  let dates;
  if(!a.cas){
    const konec = (a.konec_datum ? plus(a.konec_datum,1) : plus(a.datum,1)).replaceAll("-","");
    dates = `${d}/${konec}`;
  } else {
    const [h,m] = a.cas.split(":").map(Number);
    let kh,km,kd=a.konec_datum||a.datum;
    if(a.konec_cas){ [kh,km]=a.konec_cas.split(":").map(Number); }
    else { kh=h+2; km=m; if(kh>=24){kh-=24; kd=plus(kd,1);} }
    const pad=n=>String(n).padStart(2,"0");
    dates = `${d}T${pad(h)}${pad(m)}00/${kd.replaceAll("-","")}T${pad(kh)}${pad(km)}00`;
  }
  p.set("dates", dates);
  p.set("location", a.misto||"");
  const det = [a.url && `Info: ${a.url}`, a.vstupenky && a.vstupenky!==a.url && `Vstupenky: ${a.vstupenky}`, a.cena && `Cena: ${a.cena}`].filter(Boolean).join("\n");
  p.set("details", det);
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

function vTabu(a){
  const dnes = datumPraha(), konec = a.konec_datum || a.datum;
  const probiha = d => a.datum <= d && konec >= d;
  if(S.tab==="nove") return nova7(a);
  if(S.tab==="dnes") return probiha(dnes);
  if(S.tab==="zitra") return probiha(plus(dnes,1));
  if(S.tab==="vikend"){
    const d=new Date(dnes+"T12:00:00"); const wd=d.getDay();
    const doSo = wd===0 ? -1 : 6-wd; const so=plus(dnes,doSo), ne=plus(so,1);
    const pa=plus(so,-1);
    return probiha(pa) && (a.cas||"00:00")>="17:00" && a.datum===pa || probiha(so) || probiha(ne);
  }
  return true;
}

function filtr(a){
  if(!S.ukazSkryte && SKRYTE.has(a.id)) return false;
  if(S.typy.size && !S.typy.has(a.typ)) return false;
  if(S.misto && a.zdroj!==S.misto) return false;
  if(S.jenVolne && a.stav==="vyprodano") return false;
  if(S.q){ const q=S.q.toLowerCase(); if(!(`${a.nazev} ${a.misto} ${a.znacky||""}`.toLowerCase().includes(q))) return false; }
  return vTabu(a);
}

function karta(a){
  const b = [];
  if(jeNova(a)) b.push(`<span class="b new">nové</span>`);
  if(a.stav==="vyprodano") b.push(`<span class="b sold">vyprodáno</span>`);
  if(a.stav==="posledni") b.push(`<span class="b last">poslední vstupenky</span>`);
  if(a.stav==="volno") b.push(`<span class="b free">vstupenky</span>`);
  if(a.stav==="zruseno") b.push(`<span class="b sold">zrušeno</span>`);
  if((a.chybi_behu||0)>=2 && a.stav!=="zruseno") b.push(`<span class="b last">zrušeno?</span>`);
  (a.zmeny||[]).slice(0,1).forEach(z=>b.push(`<span class="b chg">⚠ ${esc(z.co)} (${z.kdy.slice(8,10)*1}. ${z.kdy.slice(5,7)*1}.)</span>`));
  b.push(`<span class="b">${TYPY[a.typ]||a.typ}</span>`);
  if(a.cena) b.push(`<span class="b">${esc(a.cena)}</span>`);
  const viceDni = a.konec_datum && a.konec_datum!==a.datum;
  const casTxt = a.cas ? a.cas : (viceDni ? "celý den" : "–");
  const konecTxt = viceDni ? `<small>do ${a.konec_datum.slice(8)*1}. ${a.konec_datum.slice(5,7)*1}.</small>` : (a.konec_cas?`<small>–${a.konec_cas}</small>`:"");
  const skryta = SKRYTE.has(a.id);
  return `<article class="card ${a.stav==="zruseno"?"zrus":""}">
    <div class="cas">${casTxt}${konecTxt}</div>
    <div>
      <a class="t" href="${esc(a.url||a.vstupenky||"#")}" target="_blank" rel="noopener">${esc(a.nazev)}</a>
      <div class="meta">${esc(a.misto||"")}${a.znacky?` · ${esc(a.znacky)}`:""}</div>
      <div class="badges">${b.join("")}</div>
    </div>
    <div class="acts">
      <a class="btn pri" href="${kalendarOdkaz(a)}" target="_blank" rel="noopener">+ Do kalendáře</a>
      ${a.vstupenky?`<a class="btn" href="${esc(a.vstupenky)}" target="_blank" rel="noopener">Vstupenky</a>`:""}
      <button class="btn ghost" data-skryt="${a.id}">${skryta?"Zobrazit":"Skrýt"}</button>
    </div>
  </article>`;
}

function vykresli(){
  const vyber = AKCE.filter(filtr);
  const el = document.getElementById("seznam");
  if(!vyber.length){ el.innerHTML = `<div class="empty">${S.tab==="nove"?"Za posledních 7 dní nepřibylo nic nového.":"Nic tu není."}</div>`; }
  else{
    let html="", posl="";
    const dnes = datumPraha();
    for(const a of vyber){
      const den = a.datum < dnes ? dnes : a.datum;
      if(den!==posl){ html += `<div class="den">${fmtDen(den)}</div>`; posl=den; }
      html += karta(a);
    }
    el.innerHTML = html;
  }
  // počty v záložkách
  const ulozTab=S.tab;
  document.querySelectorAll(".tab").forEach(t=>{
    S.tab=t.dataset.tab; const n=AKCE.filter(filtr).length; t.querySelector(".n").textContent=n;
  });
  S.tab=ulozTab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===S.tab));
}

function ovladani(){
  const tabs=[["nove","Nové"],["dnes","Dnes"],["zitra","Zítra"],["vikend","Víkend"],["vse","Vše"]];
  document.getElementById("tabs").innerHTML = tabs.map(([k,n])=>`<button class="tab" data-tab="${k}">${n}<span class="n"></span></button>`).join("");
  document.getElementById("tabs").onclick = e=>{ const t=e.target.closest(".tab"); if(t){S.tab=t.dataset.tab; vykresli();} };
  const pouzite=[...new Set(AKCE.map(a=>a.typ))];
  document.getElementById("typy").innerHTML = Object.entries(TYPY).filter(([k])=>pouzite.includes(k))
    .map(([k,n])=>`<button class="chip" data-typ="${k}">${n}</button>`).join("");
  document.getElementById("typy").onclick = e=>{ const c=e.target.closest(".chip"); if(!c)return;
    const k=c.dataset.typ; S.typy.has(k)?S.typy.delete(k):S.typy.add(k); c.classList.toggle("on"); vykresli(); };
  const sel=document.getElementById("misto");
  const zdroje=[...new Map(AKCE.map(a=>[a.zdroj, a.misto.split(" – ")[0].split(" (")[0]])).entries()]
    .sort((x,y)=>x[1].localeCompare(y[1],"cs"));
  sel.innerHTML += zdroje.map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join("");
  sel.onchange=()=>{S.misto=sel.value; vykresli();};
  document.getElementById("hledat").oninput=e=>{S.q=e.target.value.trim(); vykresli();};
  document.getElementById("jenVolne").onchange=e=>{S.jenVolne=e.target.checked; vykresli();};
  document.getElementById("ukazSkryte").onchange=e=>{S.ukazSkryte=e.target.checked; vykresli();};
  document.getElementById("seznam").onclick=e=>{ const b=e.target.closest("[data-skryt]"); if(!b)return;
    const id=b.dataset.skryt; SKRYTE.has(id)?SKRYTE.delete(id):SKRYTE.add(id); ulozSkryte(); vykresli(); };
}

async function start(){
  try{
    const [d,z] = await Promise.all([fetch("data/akce.json",{cache:"no-store"}).then(r=>r.json()),
                                     fetch("data/zdravi.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}))]);
    META=d.meta||{}; AKCE=d.akce||[];
    const kdy = META.vygenerovano ? new Date(META.vygenerovano).toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) : "?";
    document.getElementById("sub").textContent = `${AKCE.length} akcí na ${META.horizont_dni||60} dní dopředu · aktualizováno ${kdy}`;
    if(AKCE.some(nova7)) S.tab="nove";
    ovladani(); vykresli();
    document.getElementById("zdroje").innerHTML = Object.values(z).sort((a,b)=>a.nazev.localeCompare(b.nazev,"cs")).map(s=>
      `<li><span class="dot ${s.ok?"":"x"}"></span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nazev)}</a> – ${s.ok?`${s.pocet} akcí`:`nefunguje: ${esc(s.chyba||"")}`}</li>`).join("");
  }catch(e){
    document.getElementById("sub").textContent = "Data se nepodařilo načíst.";
    console.error(e);
  }
}
start();
</script>
</body>
</html>
