name: Web (data z GitLabu)

# Stejný projekt běží i na GitLabu (https://gitlab.com/michal.tomasek/kulturni-vlozky), který každé ráno
# sbírá akce. Tahle kopie weby znovu nestahuje: vezme hotová data z GitLabu a jen z nich složí stránku
# na GitHub Pages (~1 minuta). Když by data z GitLabu byla starší než 30 hodin (GitLab nejel, došly
# minuty…), sesbírá je tady sama – web tak zůstane čerstvý, i kdyby jedna strana vypadla.
# Repozitář je veřejný, takže minuty GitHub Actions se tu nepočítají do žádného limitu.

on:
  schedule:
    - cron: "47 4 * * *"    # po ranním sběru na GitLabu (05:13 pražského času, trvá ~6 min)
    - cron: "7 12 * * *"    # po poledním dosběru na GitLabu
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "nastroje/**", ".github/workflows/web.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Data z GitLabu
        id: data
        run: |
          set -e
          RAW="https://gitlab.com/michal.tomasek/kulturni-vlozky/-/raw/main/data"
          mkdir -p data
          for f in akce.json zdravi.json mista.json; do
            curl -fsSL --retry 3 "$RAW/$f" -o "data/$f.novy" && mv "data/$f.novy" "data/$f" || echo "nepodařilo se stáhnout $f"
          done
          STARI=$(python3 -c "
          import json, datetime as dt
          t = dt.datetime.fromisoformat(json.load(open('data/akce.json'))['meta']['vygenerovano'])
          print(int((dt.datetime.now(dt.timezone.utc) - t).total_seconds() // 3600))")
          echo "Data z GitLabu jsou stará ${STARI} h"
          if [ "$STARI" -gt 30 ]; then echo "sber=1" >> "$GITHUB_OUTPUT"; fi

      - name: Záložní sběr (jen když GitLab data nedodal)
        if: steps.data.outputs.sber == '1'
        run: |
          pip install -q -r requirements.txt
          python -m unittest discover -s tests
          python run.py

      - name: Složení stránky
        run: |
          mkdir -p public/data
          cp index.html public/
          touch public/.nojekyll
          cp data/zdravi.json public/data/
          python3 nastroje/rozdel.py public/data
          python3 nastroje/leaflet.py public/vendor/leaflet

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: nasazeni
        uses: actions/deploy-pages@v4
