name: Snapshot zdrojů (ladění)

# Jen ruční spuštění. Stažené stránky se neukládají do repa (jsou cizí obsah),
# ale jako dočasný soubor ke stažení u běhu (Actions -> běh -> Artifacts).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python nastroje/snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw
          retention-days: 7
