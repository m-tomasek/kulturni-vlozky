name: Snapshot zdrojů (ladění)

# Ručně: stáhne stránky z nastroje/pruzkum.txt a vyzkouší nastavení z nastroje/zkus.yml (artefakt raw).
# Totéž umí GitLab (Run pipeline, input job = snapshot).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements.txt
      - run: python nastroje/snapshot.py --pruzkum
      - run: python nastroje/prohlidni.py
      - run: python nastroje/zkus.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw
          retention-days: 7
      # kopie stažených stránek do větve ladeni-raw (ať se dají číst i bez stahování artefaktu)
      - run: |
          cd raw && git init -q -b ladeni-raw && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "raw $(date -u +%F_%T)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ladeni-raw
