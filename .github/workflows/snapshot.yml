name: Snapshot zdrojů (ladění)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - zdroje.yml
      - nastroje/snapshot.py
      - .github/workflows/snapshot.yml
      - nastroje/snapshot.trigger

permissions:
  contents: write

concurrency:
  group: zapis-do-repa
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python nastroje/snapshot.py
      - name: Uložit do repa
        run: |
          git config user.name "kulturni-vlozky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw
          git commit -m "Snapshot zdrojů $(date -u +%F)" || echo "beze změn"
          git pull --rebase
          git push
